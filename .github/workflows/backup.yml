name: Sauvegarde automatique Supabase

on:
  schedule:
    # 03:00 UTC chaque jour (le projet Supabase est sur le plan gratuit, sans
    # sauvegarde/point-in-time recovery integree -- voir l'incident de suppression
    # accidentelle de la table products documente dans l'historique du projet).
    - cron: '0 3 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verifier que le secret est configure
        run: |
          if [ -z "${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" ]; then
            echo "::error::Le secret SUPABASE_SERVICE_ROLE_KEY n'est pas configure. Voir README.md pour la procedure."
            exit 1
          fi

      - name: Exporter les tables Supabase
        env:
          SUPABASE_URL: https://tbowuuxvjaadawhmpumr.supabase.co
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -e
          DATE=$(date -u +%Y-%m-%d)
          OUT="backups/$DATE"
          mkdir -p "$OUT"
          TABLES="products categories orders order_items suppliers media_config returns testimonials delivery_zones contact_messages newsletter_subscribers gift_box_templates"
          for T in $TABLES; do
            echo "Export de $T..."
            curl -sf "$SUPABASE_URL/rest/v1/$T?select=*" \
              -H "apikey: $SUPABASE_KEY" \
              -H "Authorization: Bearer $SUPABASE_KEY" \
              -o "$OUT/$T.raw.json"
            python3 -m json.tool "$OUT/$T.raw.json" > "$OUT/$T.json"
            rm "$OUT/$T.raw.json"
          done
          echo "DATE=$DATE" >> "$GITHUB_ENV"

      - name: Supprimer les sauvegardes de plus de 30 jours
        run: |
          find backups -maxdepth 1 -mindepth 1 -type d -mtime +30 -exec rm -rf {} \; || true

      - name: Purger les photos clientes de plus de 7 jours
        env:
          SUPABASE_URL: https://tbowuuxvjaadawhmpumr.supabase.co
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          python3 - <<'PY'
          import os, json, urllib.request, datetime

          base = os.environ['SUPABASE_URL']
          key = os.environ['SUPABASE_KEY']
          headers = {'apikey': key, 'Authorization': f'Bearer {key}', 'Content-Type': 'application/json'}

          def call(method, path, body=None):
              data = json.dumps(body).encode() if body is not None else None
              req = urllib.request.Request(base + path, data=data, headers=headers, method=method)
              with urllib.request.urlopen(req) as resp:
                  raw = resp.read()
                  return json.loads(raw) if raw else None

          # Les photos que les clientes joignent au checkout (ex: photo de teint pour
          # un fond de teint) ne sont gardees que 7 jours : le temps que l'admin
          # prepare la commande, pas une archive permanente de photos personnelles.
          objects = call('POST', '/storage/v1/object/list/client-uploads', {'prefix': 'notes/', 'limit': 1000}) or []
          cutoff = datetime.datetime.now(datetime.timezone.utc) - datetime.timedelta(days=7)
          old_paths = [
              'notes/' + o['name'] for o in objects
              if o.get('created_at') and datetime.datetime.fromisoformat(o['created_at'].replace('Z', '+00:00')) < cutoff
          ]

          if not old_paths:
              print('Aucune photo cliente de plus de 7 jours.')
          else:
              print(f'Suppression de {len(old_paths)} photo(s) cliente(s) de plus de 7 jours...')
              call('DELETE', '/storage/v1/object/client-uploads', {'prefixes': old_paths})
              for p in old_paths:
                  call('PATCH', f'/rest/v1/order_items?client_photo_path=eq.{p}', {'client_photo_path': None})
              print('Purge terminee.')
          PY

      - name: Commit et push
        run: |
          git config user.name "urbann-beauty-backup-bot"
          git config user.email "actions@github.com"
          git add backups
          if git diff --cached --quiet; then
            echo "Rien de nouveau a sauvegarder."
          else
            git commit -m "chore(backup): sauvegarde automatique du $DATE"
            git push
          fi
