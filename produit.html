<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title id="doc-title">Produit — Urbann Beauty</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css"><link rel="stylesheet" href="assets/css/pages.css"><link rel="stylesheet" href="assets/css/cart-buttons.css">
<style>
.shade-overlay{position:fixed;inset:0;background:rgba(36,27,46,.55);display:none;align-items:center;justify-content:center;z-index:200;padding:16px}
.shade-overlay.open{display:flex}
.shade-modal{background:var(--white);border-radius:var(--radius-lg);max-width:440px;width:100%;max-height:90vh;overflow:auto;padding:24px}
.shade-modal h3{margin:0 0 4px}
.shade-close{float:right;background:none;border:0;cursor:pointer;color:var(--ink-soft)}
.shade-upload{display:block;border:2px dashed var(--mauve-200);border-radius:var(--radius-md);padding:32px 16px;text-align:center;cursor:pointer;margin-top:14px}
.shade-upload svg{width:30px;height:30px;color:var(--mauve-500);margin-bottom:8px}
.shade-canvas-wrap{position:relative;border-radius:var(--radius-md);overflow:hidden;line-height:0;margin-top:14px}
.shade-canvas-wrap canvas{width:100%;display:block;cursor:crosshair}
.shade-marker{position:absolute;width:26px;height:26px;border:3px solid #fff;border-radius:50%;box-shadow:0 0 0 2px var(--mauve-500),0 2px 10px rgba(0,0,0,.35);transform:translate(-50%,-50%);pointer-events:none}
.shade-result{text-align:center;margin-top:16px}
.shade-result .pct{font-size:2rem;font-weight:700;color:var(--mauve-600)}
.shade-swatches{display:flex;justify-content:center;gap:16px;margin:12px 0}
.shade-swatches div{text-align:center;font-size:.72rem;color:var(--ink-soft)}
.shade-swatches span{display:block;width:40px;height:40px;border-radius:50%;box-shadow:0 0 0 1px var(--line);margin:0 auto 4px}
</style>
<link rel="icon" type="image/png" href="https://tbowuuxvjaadawhmpumr.supabase.co/storage/v1/object/public/media/logo.png"></head><body>
<div id="site-header"></div><div class="breadcrumb"><div class="container"><a href="index.html">Accueil</a><span>/</span><a href="boutique.html">Boutique</a><span>/</span><span id="bc-current">Produit</span></div></div>
<section style="padding-top:48px" id="product-section"></section>
<section style="background:var(--off-white)"><div class="container"><div class="section-toolbar reveal"><div class="section-head" style="text-align:left;margin:0"><span class="eyebrow">Complétez votre routine</span><h2 style="margin:0">Vous aimerez aussi</h2></div></div><div class="product-grid" id="related-grid"></div></div></section>
<section class="ub-recent-strip" id="recent-section" style="display:none"><div class="container"><div class="section-head" style="text-align:left;margin:0 0 26px;max-width:none"><span class="eyebrow">Votre parcours</span><h2 style="margin:0">Vus récemment</h2></div><div class="product-grid" id="recent-grid"></div></div></section>
<div id="site-footer"></div>
<div class="shade-overlay" id="shade-overlay"><div class="shade-modal" id="shade-modal-body"></div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script><script src="assets/js/icons.js"></script><script src="assets/js/data.js"></script><script src="assets/js/media.js"></script><script src="assets/js/main.js"></script><script src="assets/js/ub-guide.js"></script><script src="assets/js/teinte.js"></script>
<script>
async function main(){
ubRenderHeader('boutique');ubRenderFooter();
const params=new URLSearchParams(location.search),requestedId=params.get('id'),allProducts=await ubGetAllProducts();
let product=requestedId?await ubGetProduct(requestedId):null;
if(!product)product=allProducts.find(p=>p.id===requestedId)||allProducts[0];
if(!product){document.getElementById('product-section').innerHTML='<div class="container"><div class="empty-cart"><h3>Produit introuvable</h3><p>Ce produit n’est plus disponible.</p><a class="btn btn-primary" href="boutique.html">Retour à la boutique</a></div></div>';return}
const [cat,testimonials,allCategories]=await Promise.all([ubGetCategory(product.category),ubGetProductTestimonials(product.id),ubGetAllCategories()]);
const catsById=ubCatsById(allCategories);
let qty=1;
ubRememberViewed(product.id);
ubTrackOncePerDay('product_view',product.id,{productId:product.id});
document.title=product.name+' — Urbann Beauty';
document.getElementById('bc-current').textContent=product.name;
const productUrl=location.origin+location.pathname+'?id='+encodeURIComponent(product.id);
const askText=`Bonjour Urbann Beauty, j'ai une question sur le produit "${product.name}" (${ubFormatPrice(product.price)}) : ${productUrl}`;
const askLink=`https://wa.me/${UB_CONTACT.whatsapp}?text=${encodeURIComponent(askText)}`;
ubSetWhatsAppContext(askText);
const gallery=[{type:'image',src:product.img},...(product.gallery||[]).map(src=>({type:'image',src}))];
if(product.video)gallery.push({type:'video',src:product.video,poster:product.img});
const soldOut=product.stock<=0,lowStock=!soldOut&&product.stock<=5;
const saving=product.oldPrice&&product.oldPrice>product.price?product.oldPrice-product.price:0;
const stockHTML=soldOut?`<div class="pd-stock is-out"><span class="dot"></span>Épuisé pour le moment</div>`:lowStock?`<div class="pd-stock is-low"><span class="dot"></span>Plus que ${product.stock} en stock — commandez vite</div>`:`<div class="pd-stock"><span class="dot"></span>En stock, prêt à être expédié</div>`;
const notifyLink=`https://wa.me/${UB_CONTACT.whatsapp}?text=${encodeURIComponent(`Bonjour, le produit "${product.name}" est épuisé sur le site. Pouvez-vous me prévenir dès son retour en stock ?`)}`;
const actionsHTML=soldOut
  ?`<div class="pd-actions"><a class="btn btn-primary btn-wa" href="${notifyLink}" target="_blank" rel="noopener" onclick="ubTrack('whatsapp_click',{productId:'${product.id}'})">${ubIcon('whatsapp')} Me prévenir du retour en stock</a><button class="icon-btn ${ubIsWished(product.id)?'is-on':''}" data-wish="${product.id}" style="border:1px solid var(--line)" onclick="ubToggleWishlist('${product.id}')" aria-label="Ajouter aux favoris">${ubIcon('heart')}</button></div>`
  :`<div class="pd-actions" id="pd-main-actions"><div class="qty-selector"><button onclick="ubChangeQty(-1)" aria-label="Moins">−</button><span id="qty-value">1</span><button onclick="ubChangeQty(1)" aria-label="Plus">+</button></div><button class="btn btn-primary" onclick="ubAddToCartClick()">${ubIcon('bag')} Ajouter au panier</button><button class="btn btn-buy-now" onclick="ubBuyNow()">Acheter maintenant</button><button class="icon-btn ${ubIsWished(product.id)?'is-on':''}" data-wish="${product.id}" style="border:1px solid var(--line)" onclick="ubToggleWishlist('${product.id}')" aria-label="Ajouter aux favoris">${ubIcon('heart')}</button></div>`;
document.getElementById('product-section').innerHTML=`<div class="container"><div class="product-detail"><div><div class="pd-gallery-main" id="pd-gallery-main"><img src="${gallery[0].src}" alt="${product.name}"></div><div class="pd-thumbs">${gallery.map((g,i)=>`<div class="thumb ${i===0?'active':''}" onclick="ubSwitchMedia(${i})"><img src="${g.poster||g.src}" alt=""><span style="display:${g.type==='video'?'grid':'none'}" class="play">${g.type==='video'?ubIcon('play'):''}</span></div>`).join('')}</div></div>
<div class="pd-info"><span class="product-cat">${cat?.name||'Beauté'}</span><h1>${product.name}</h1>
${product.reviews>0?`<div class="pd-rating"><span class="stars">${'★'.repeat(Math.round(product.rating))}${'☆'.repeat(5-Math.round(product.rating))}</span><a href="#pd-tabs" onclick="ubSwitchTab(2)" style="color:inherit">${product.rating} / 5 · ${product.reviews} avis</a></div>`:`<div class="pd-rating"><span style="color:var(--ink-soft)">Nouveauté · achetée ? <a href="suivi.html" style="color:var(--mauve-600)">Donnez votre avis</a></span></div>`}
<div class="pd-price"><span class="price-now">${ubFormatPrice(product.price)}</span>${product.oldPrice?`<span class="price-old">${ubFormatPrice(product.oldPrice)}</span><span class="badge badge-danger">-${Math.round((1-product.price/product.oldPrice)*100)}%</span>`:''}</div>
${saving?`<p class="pd-save" style="margin:-10px 0 16px">Vous économisez ${ubFormatPrice(saving)}</p>`:''}
<p class="pd-desc">${product.desc||''}</p>
${stockHTML}
${actionsHTML}
${product.shadeHex?`<button class="btn" style="margin:-8px 0 16px;width:100%" onclick="ubOpenShadeCheck()">${ubIcon('camera')} Est-ce ma teinte ? Vérifiez avec une photo</button>`:''}
<div class="pd-delivery-box">
<div>${ubIcon('truck')}<span><strong>Expédition sous 24h ouvrées</strong> · livraison offerte dès ${ubFormatPrice(UB_FREE_SHIPPING_THRESHOLD)}</span></div>
<div>${ubIcon('pin')}<span><strong>Retrait gratuit</strong> à notre point de vente (${UB_CONTACT.pickupAddress})</span></div>
<div>${ubIcon('shield')}<span><strong>Paiement Wave</strong> : en totalité, ou acompte de 20% et solde à la livraison</span></div>
<div>${ubIcon('return')}<span><a href="retour.html" style="color:inherit"><strong>Retour possible sous 7 jours</strong></a></span></div>
</div>
<a class="pd-ask-wa" href="${askLink}" target="_blank" rel="noopener" onclick="ubTrack('whatsapp_click',{productId:'${product.id}'})">${ubIcon('whatsapp')} Une question ? Une conseillère vous répond sur WhatsApp</a>
<div id="pd-bundle"></div>
<div class="pd-meta"><div><strong>Référence :</strong> UB-${String(product.id).toUpperCase()}</div><div><strong>Catégorie :</strong> ${cat?.name||'Beauté'}</div></div>
</div></div>
<div class="pd-tabs" id="pd-tabs"><button class="active" onclick="ubSwitchTab(0)">Description</button><button onclick="ubSwitchTab(1)">Livraison &amp; paiement</button><button onclick="ubSwitchTab(2)">Avis (${product.reviews})</button></div>
<div class="pd-tab-panel active" id="tab-0"><p>${product.desc||''}</p><p style="color:var(--ink-soft)">Besoin de la composition détaillée ou d'un conseil d'utilisation ? <a href="${askLink}" target="_blank" rel="noopener" style="color:var(--mauve-600);font-weight:600">Demandez-nous sur WhatsApp</a>.</p></div>
<div class="pd-tab-panel" id="tab-1"><p><strong>Livraison :</strong> expédition sous 24h ouvrées à Dakar et environs, frais selon votre zone (affichés au panier) et offerts dès ${ubFormatPrice(UB_FREE_SHIPPING_THRESHOLD)}. Retrait gratuit possible à notre point de vente.</p><p><strong>Paiement :</strong> via Wave, en totalité ou avec un acompte de 20% (le solde se règle à la livraison). Joignez simplement la capture de votre paiement au moment de valider.</p><p><strong>Suivi :</strong> vous recevez la confirmation et le suivi sur WhatsApp, et pouvez suivre votre commande à tout moment depuis <a href="suivi.html" style="color:var(--mauve-600)">cette page</a>.</p></div>
<div class="pd-tab-panel" id="tab-2"><div class="testi-grid" style="grid-template-columns:1fr">${testimonials.slice(0,4).map(t=>ubTestimonialCardHTML(t)).join('')}</div></div></div>`;

window.ubChangeQty=d=>{const max=product.stock>0?product.stock:99;qty=Math.min(max,Math.max(1,qty+d));document.getElementById('qty-value').textContent=qty};
window.ubAddToCartClick=()=>ubAddToCart(product.id,qty);
window.ubBuyNow=()=>{ubAddToCart(product.id,qty,{silent:true});location.href='panier.html'};
window.ubSwitchMedia=i=>{document.querySelectorAll('.pd-thumbs .thumb').forEach((t,idx)=>t.classList.toggle('active',idx===i));const g=gallery[i];document.getElementById('pd-gallery-main').innerHTML=g.type==='video'?`<video src="${g.src}" controls autoplay poster="${g.poster}"></video>`:`<img src="${g.src}" alt="${product.name}">`};
window.ubSwitchTab=i=>{document.querySelectorAll('.pd-tabs button').forEach((b,idx)=>b.classList.toggle('active',idx===i));document.querySelectorAll('.pd-tab-panel').forEach((p,idx)=>p.classList.toggle('active',idx===i))};

/* Souvent achetes ensemble : 2 produits complementaires en stock, ajoutables en un clic. */
const bundleItems=soldOut?[]:allProducts.filter(p=>p.id!==product.id&&p.stock>0).sort((a,b)=>((b.category===product.category)-(a.category===product.category))||(b.rating-a.rating)).slice(0,2);
if(bundleItems.length){
  const all=[product,...bundleItems];
  document.getElementById('pd-bundle').innerHTML=`<div class="pd-bundle"><h4>Souvent achetés ensemble</h4><div class="pd-bundle-items">${all.map((p,i)=>`${i?'<span class="plus">+</span>':''}<label><img src="${p.img}" alt=""><span><input type="checkbox" data-bundle="${p.id}" checked ${i===0?'disabled':''}> ${i===0?'Cet article':p.name}</span></label>`).join('')}</div><div class="pd-bundle-foot"><span>Total : <strong id="bundle-total"></strong></span><button class="btn btn-primary btn-sm" type="button" id="bundle-add">Ajouter la sélection</button></div></div>`;
  const update=()=>{const ids=[...document.querySelectorAll('[data-bundle]:checked')].map(c=>c.dataset.bundle);document.getElementById('bundle-total').textContent=ubFormatPrice(all.filter(p=>ids.includes(p.id)).reduce((s,p)=>s+p.price,0));document.getElementById('bundle-add').textContent=ids.length>1?`Ajouter les ${ids.length} au panier`:'Ajouter au panier';return ids};
  document.querySelectorAll('[data-bundle]').forEach(c=>c.addEventListener('change',update));update();
  document.getElementById('bundle-add').addEventListener('click',()=>{update().forEach(id=>ubAddToCart(id,1,{silent:true}));ubOpenCartDrawer(product.id)});
}

/* Barre d'achat collante quand le bouton principal sort de l'ecran. */
const mainActions=document.getElementById('pd-main-actions');
if(mainActions&&'IntersectionObserver' in window){
  const bar=document.createElement('div');
  bar.className='pd-sticky';
  bar.innerHTML=`<img src="${product.img}" alt=""><div class="info"><strong>${product.name}</strong><span>${ubFormatPrice(product.price)}</span></div><button class="btn btn-primary" type="button">${ubIcon('bag')} Ajouter</button>`;
  bar.querySelector('button').addEventListener('click',()=>ubAddToCartClick());
  document.body.appendChild(bar);
  new IntersectionObserver(([e])=>{const show=!e.isIntersecting&&e.boundingClientRect.top<0;bar.classList.toggle('show',show);document.body.classList.toggle('has-sticky-bar',show)}).observe(mainActions);
}

document.getElementById('related-grid').innerHTML=allProducts.filter(p=>p.category===product.category&&p.id!==product.id).slice(0,4).map(p=>ubProductCardHTML(p,catsById)).join('')||allProducts.filter(p=>p.id!==product.id).slice(0,4).map(p=>ubProductCardHTML(p,catsById)).join('');
const byId=Object.fromEntries(allProducts.map(p=>[p.id,p]));
const recent=ubGetRecentlyViewed().filter(id=>id!==product.id).map(id=>byId[id]).filter(Boolean).slice(0,4);
if(recent.length){document.getElementById('recent-section').style.display='';document.getElementById('recent-grid').innerHTML=recent.map(p=>ubProductCardHTML(p,catsById)).join('')}
ubInitReveal();
window.ubOpenShadeCheck=function(){
  const overlay=document.getElementById('shade-overlay'),body=document.getElementById('shade-modal-body');
  overlay.classList.add('open');
  overlay.onclick=e=>{if(e.target===overlay)overlay.classList.remove('open')};
  function renderUpload(){
    body.innerHTML=`<button class="shade-close" onclick="document.getElementById('shade-overlay').classList.remove('open')">${ubIcon('close')}</button><h3>Est-ce ma teinte ?</h3><p style="color:var(--ink-soft);font-size:.85rem;margin:0">On compare une photo de votre peau à la teinte "${product.shadeLabel||product.name}".</p><label class="shade-upload" for="shade-file">${ubIcon('camera')}<p><strong>Prendre ou importer une photo</strong></p></label><input type="file" id="shade-file" accept="image/*" hidden>`;
    document.getElementById('shade-file').addEventListener('change',async e=>{const file=e.target.files[0];if(file)await renderCanvas(file)});
  }
  async function renderCanvas(file){
    body.innerHTML=`<button class="shade-close" onclick="document.getElementById('shade-overlay').classList.remove('open')">${ubIcon('close')}</button><h3>Touchez votre peau</h3><div class="shade-canvas-wrap" id="shade-canvas-wrap"><canvas id="shade-canvas"></canvas></div><p style="text-align:center;font-size:.78rem;color:var(--ink-soft);margin-top:8px">Évitez l'ombre, le reflet ou le maquillage.</p>`;
    const canvas=document.getElementById('shade-canvas');
    try{await ubDrawPhotoToCanvas(file,canvas)}catch(e){ubShowToast("Photo illisible, réessayez");renderUpload();return}
    const wrap=document.getElementById('shade-canvas-wrap');
    let marker=null;
    canvas.addEventListener('click',e=>{
      const rect=canvas.getBoundingClientRect(),scaleX=canvas.width/rect.width,scaleY=canvas.height/rect.height;
      const x=(e.clientX-rect.left)*scaleX,y=(e.clientY-rect.top)*scaleY;
      const sampledHex=ubSampleColorAt(canvas,x,y,Math.max(10,canvas.width*0.03));
      if(!marker){marker=document.createElement('div');marker.className='shade-marker';wrap.appendChild(marker)}
      marker.style.left=((e.clientX-rect.left)/rect.width*100)+'%';marker.style.top=((e.clientY-rect.top)/rect.height*100)+'%';marker.style.background=sampledHex;
      setTimeout(()=>renderResult(sampledHex),300);
    });
  }
  function renderResult(sampledHex){
    const deltaE=ubDeltaE(sampledHex,product.shadeHex),pct=ubMatchPercent(deltaE);
    const verdict=pct>=85?"C'est une très bonne correspondance !":pct>=65?"Correspondance correcte, à vérifier en boutique si possible.":"Cette teinte n'est probablement pas idéale pour vous.";
    body.innerHTML=`<button class="shade-close" onclick="document.getElementById('shade-overlay').classList.remove('open')">${ubIcon('close')}</button><h3>Résultat</h3><div class="shade-result"><div class="pct">${pct}%</div><p style="color:var(--ink-soft);margin:4px 0 0">${verdict}</p><div class="shade-swatches"><div><span style="background:${sampledHex}"></span>Votre peau</div><div><span style="background:${product.shadeHex}"></span>${product.shadeLabel||product.name}</div></div></div><div style="display:flex;gap:10px;justify-content:center;margin-top:16px"><button class="btn" id="shade-retry">Refaire</button><button class="btn btn-primary" onclick="ubAddToCartClick();document.getElementById('shade-overlay').classList.remove('open')">Ajouter au panier</button></div>`;
    document.getElementById('shade-retry').addEventListener('click',renderUpload);
  }
  renderUpload();
};
}
main();
</script></body></html>
