<!DOCTYPE html><html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Panier — Urbann Beauty</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="assets/css/style.css"><link rel="stylesheet" href="assets/css/pages.css"><link rel="stylesheet" href="assets/css/cart-buttons.css">
<style>
.note-overlay{position:fixed;inset:0;background:rgba(36,27,46,.55);display:none;align-items:center;justify-content:center;z-index:1100;padding:16px}
.note-overlay.open{display:flex}
.note-modal{background:var(--white);border-radius:var(--radius-lg);max-width:440px;width:100%;max-height:90vh;overflow:auto;padding:24px}
.note-modal h3{margin:0 0 4px}
.note-close{float:right;background:none;border:0;cursor:pointer;color:var(--ink-soft)}
.note-modal textarea{width:100%;border:1px solid var(--line);border-radius:var(--radius-sm);padding:10px 12px;font:inherit;margin-top:12px;resize:vertical}
.note-photo-zone{display:block;border:2px dashed var(--mauve-200);border-radius:var(--radius-md);padding:20px;text-align:center;cursor:pointer;margin-top:12px;font-size:.84rem}
.note-photo-zone svg{width:24px;height:24px;color:var(--mauve-500);margin-bottom:4px}
.proof-zone{margin-top:6px}
.proof-upload{display:flex;align-items:center;gap:8px;border:2px dashed var(--mauve-300);border-radius:var(--radius-sm);padding:12px 14px;cursor:pointer;font-size:.82rem;font-weight:600;color:var(--mauve-700);background:var(--mauve-50)}
.proof-upload svg{width:18px;height:18px;flex-shrink:0}
.note-photo-zone img{max-width:100%;max-height:160px;border-radius:8px;display:block;margin:0 auto}
.ub-co-summary .summary-row{margin-bottom:0}
</style>
<link rel="icon" type="image/png" href="https://tbowuuxvjaadawhmpumr.supabase.co/storage/v1/object/public/media/logo.png"></head><body>
<div id="site-header"></div><div class="breadcrumb"><div class="container"><a href="index.html">Accueil</a><span>/</span><span>Panier</span></div></div>
<section style="padding-top:40px"><div class="container"><div class="section-head" style="text-align:left;margin:0 0 22px;max-width:none"><span class="eyebrow">Commande sécurisée</span><h2 style="margin:0">Mon panier</h2></div><div id="cart-content"></div></div></section>
<section class="ub-co-upsell" id="upsell-section" style="display:none;background:var(--off-white);padding:56px 0"><div class="container"><div class="section-head" style="text-align:left;margin:0 0 24px;max-width:none"><span class="eyebrow">Les clientes ajoutent aussi</span><h2 style="margin:0">Complétez votre routine</h2></div><div class="product-grid" id="upsell-grid"></div></div></section>
<div id="site-footer"></div>
<div class="note-overlay" id="note-overlay"><div class="note-modal" id="note-modal-body"></div></div>
<div class="ub-mobile-cta" id="mobile-cta"><div><small id="mobile-cta-label">À payer maintenant</small><strong id="mobile-cta-amount"></strong></div><button type="button" class="btn btn-primary" onclick="ubSubmitOrder()">Valider ma commande</button></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script><script src="assets/js/icons.js"></script><script src="assets/js/data.js"></script><script src="assets/js/media.js"></script><script src="assets/js/main.js"></script><script src="assets/js/ub-guide.js"></script>
<script>
ubRenderHeader('boutique');ubRenderFooter();

const UB_PAYMENT_METHODS = [
  { value: 'Wave', title: 'Payer la totalité avec Wave', desc: 'Commande préparée en priorité, rien à régler à la réception.', tag: 'Recommandé' },
  { value: 'Paiement à la livraison', title: 'Acompte 20% + solde à la livraison', desc: 'Réglez l\'acompte sur Wave, le reste en espèces ou Wave à la réception.' },
];
const UB_WAVE_PAYMENT_LINK = 'https://pay.wave.com/m/M_sn_DP533wZ-yIia/c/sn/';
const UB_DEPOSIT_RATE = 0.2;
let catalog = null;
let currentLines = [];
let currentSum = null;
let currentZones = [];
let currentSubtotal = 0;
let appliedPromo = null;
let availablePromoCodes = {}; // rempli depuis l'admin (promo_codes), vide par defaut
let wavePaymentProofPath = null; // capture d'ecran Wave jointe, obligatoire avant de valider
let orderDone = false;

/* ---------- Coordonnees memorisees (la cliente n'a rien a ressaisir la prochaine fois) ---------- */
function ubGetSavedCustomer(){ return ubStore('ub_customer', {}); }
function ubSaveCustomerField(key, value){ const c = ubGetSavedCustomer(); c[key] = value; ubStoreSet('ub_customer', c); }

/* ---------- Panier abandonne : l'admin peut relancer sur WhatsApp ---------- */
function ubCartSessionId(){
  let id = ubStore('ub_cart_sid', null);
  if(!id){ id = ubRandomId('c'); ubStoreSet('ub_cart_sid', id); }
  return id;
}
let cartSaveTimer = null;
function ubQueueCartSessionSave(){
  clearTimeout(cartSaveTimer);
  cartSaveTimer = setTimeout(ubSaveCartSessionNow, 1200);
}
function ubSaveCartSessionNow(){
  if(orderDone || !currentSum || !currentSum.count) return;
  const zone = ubSelectedZone();
  const items = [
    ...currentSum.boxes.map(b => ({ id: b.templateId, name: 'Box cadeau — ' + (b.label || ''), qty: 1, price: b.price, box: true })),
    ...currentSum.regular.map(l => ({ id: l.id, name: l.product.name + (l.shade ? ` (teinte ${l.shade})` : ''), qty: l.qty, price: l.product.price })),
  ];
  const v = ubFormValues();
  ubSupabase.rpc('ub_save_cart_session', {
    p_id: ubCartSessionId(), p_client_name: v.name || null, p_phone: v.phone || null, p_zone: zone ? zone.name : null,
    p_items: items, p_cart_value: currentSubtotal, p_step: ubCurrentStep() === 3 ? 'paiement' : (v.name || v.phone) ? 'coordonnees' : 'panier',
  }).then(() => {}, () => {});
}

/* ---------- Montants ---------- */
function ubSelectedZone(){
  const id = document.getElementById('co-zone')?.value;
  return currentZones.find(z => String(z.id) === id) || currentZones[0];
}
function ubDiscountAmount(){ return appliedPromo ? Math.round(currentSubtotal * appliedPromo.percent / 100) : 0; }
function ubShippingAmount(){
  const zone = ubSelectedZone();
  return (currentSubtotal - ubDiscountAmount()) >= UB_FREE_SHIPPING_THRESHOLD ? 0 : (zone ? zone.fee : 2500);
}
function ubCurrentTotal(){ return currentSubtotal - ubDiscountAmount() + ubShippingAmount(); }
function ubDepositAmount(total){ return Math.ceil((total != null ? total : ubCurrentTotal()) * UB_DEPOSIT_RATE); }
function ubSelectedPayment(){ return document.querySelector('input[name="payment"]:checked')?.value || UB_PAYMENT_METHODS[0].value; }
function ubAmountDueNow(){ const t = ubCurrentTotal(); return ubSelectedPayment() === 'Paiement à la livraison' ? ubDepositAmount(t) : t; }

function ubFormValues(){
  return {
    name: (document.getElementById('co-name')?.value || '').trim(),
    phone: (document.getElementById('co-phone')?.value || '').trim(),
    address: (document.getElementById('co-address')?.value || '').trim(),
  };
}
function ubPhoneValid(phone){ const d = String(phone || '').replace(/\D/g, ''); return d.length >= 9 && d.length <= 15; }
/* Info manquante sur une ligne : photo obligatoire (fond de teint...), teinte non
   choisie, ou precision demandee par le produit. */
function ubLineMissing(l){
  if(l.boxInstanceId) return null;
  if(l.product.shadeOptions && l.product.shadeOptions.length && !l.shade) return 'teinte';
  if(l.product.requiresPhoto && !l.clientPhotoPath) return 'photo';
  if(l.product.requiresClientNote && !(l.clientNote || l.clientPhotoPath)) return 'info';
  return null;
}
function ubMissingNoteLine(){ return currentLines.find(l => ubLineMissing(l)); }
function ubCurrentStep(){
  const v = ubFormValues();
  if(ubMissingNoteLine()) return 1;
  if(!v.name || !ubPhoneValid(v.phone)) return 2;
  return 3;
}
function ubUpdateSteps(){
  const step = ubCurrentStep();
  document.querySelectorAll('.ub-steps li').forEach((li, i) => {
    const n = i + 1;
    li.classList.toggle('is-done', n < step || (n === 3 && !!wavePaymentProofPath && step === 3));
    li.classList.toggle('is-active', n === step && !(n === 3 && wavePaymentProofPath));
  });
}

/* ---------- Rendu ---------- */
function ubEmptyCartHTML(){
  return `<div class="empty-cart">${ubIcon('bag')}<h3>Votre panier est vide</h3><p style="color:var(--ink-soft)">Vous n’avez encore rien ajouté. Découvrez nos soins et trouvez vos essentiels.</p><a href="boutique.html" class="btn btn-primary">Découvrir la boutique</a></div>`;
}

async function renderCart(){
  const container = document.getElementById('cart-content');
  if(!ubGetCart().length){ container.innerHTML = ubEmptyCartHTML(); document.getElementById('upsell-section').style.display = 'none'; ubToggleMobileCta(false); return; }
  const [cat, zones, promoCodes] = await Promise.all([ubGetCatalog(), ubGetDeliveryZones(), ubGetActivePromoCodes()]);
  catalog = cat;
  currentZones = zones;
  availablePromoCodes = Object.fromEntries(promoCodes.map(c => [c.code.toUpperCase(), { percent: c.percent, label: c.label }]));
  const saved = ubGetSavedCustomer();
  const savedZone = zones.find(z => String(z.id) === String(saved.zoneId));
  const hasPromos = Object.keys(availablePromoCodes).length > 0;

  container.innerHTML = `
  <ol class="ub-steps"><li class="is-active">Panier</li><span class="sep"></span><li>Coordonnées</li><span class="sep"></span><li>Paiement</li></ol>
  <div class="ub-co-grid">
    <div class="ub-co-main">
      <section class="ub-co-card" id="co-step-cart">
        <h3><span class="num">1</span> Votre sélection <small id="co-count"></small></h3>
        <div id="co-ship-progress"></div>
        <div class="ub-co-lines" id="co-lines"></div>
        <a href="boutique.html" style="display:inline-block;margin-top:10px;font-size:.8rem;color:var(--mauve-600)">← Continuer mes achats</a>
      </section>

      <section class="ub-co-card" id="co-step-info">
        <h3><span class="num">2</span> Vos coordonnées <small>Aucun compte à créer</small></h3>
        <div class="ub-co-fields">
          <div class="field" id="f-name"><label for="co-name">Nom complet *</label><input id="co-name" type="text" autocomplete="name" placeholder="Ex : Awa Diop" value="${ubEscapeHtml(saved.name || '')}"><p class="field-hint" style="display:none"></p></div>
          <div class="field" id="f-phone"><label for="co-phone">Téléphone WhatsApp *</label><div class="ub-phone-wrap"><span>+221</span><input id="co-phone" type="tel" inputmode="tel" autocomplete="tel" placeholder="77 000 00 00" value="${ubEscapeHtml(saved.phone || '')}"></div><p class="field-hint">Pour la confirmation et le suivi de livraison.</p></div>
          <div class="field full" id="f-zone"><label for="co-zone">Zone de livraison *</label><select id="co-zone">${zones.map((z, i) => `<option value="${z.id}" ${(savedZone ? z.id === savedZone.id : i === 0) ? 'selected' : ''}>${ubEscapeHtml(z.name)} — ${z.fee === 0 ? 'Gratuit' : ubFormatPrice(z.fee)}</option>`).join('')}</select>
            <p id="pickup-hint" style="display:none;font-size:.78rem;line-height:1.5;color:var(--mauve-700);background:var(--mauve-50);border-radius:var(--radius-sm);padding:8px 10px;margin:8px 0 0"><span style="display:inline-block;width:14px;height:14px;vertical-align:-2px;margin-right:4px">${ubIcon('bag')}</span>Retrait gratuit à notre point de vente : <strong>${UB_CONTACT.pickupAddress}</strong>. Nous vous contacterons sur WhatsApp pour convenir de l'heure.</p></div>
          <div class="field full"><label id="address-label" for="co-address">Adresse précise (quartier, repère...)</label><input id="co-address" type="text" autocomplete="street-address" placeholder="Ex : Villa 12, Cité Keur Gorgui" value="${ubEscapeHtml(saved.address || '')}"></div>
        </div>
        <p class="ub-remember">${ubIcon('shield')} Vos coordonnées restent sur cet appareil pour vos prochaines commandes.</p>
      </section>

      <section class="ub-co-card" id="co-step-pay">
        <h3><span class="num">3</span> Paiement</h3>
        <div class="ub-pay-options">${UB_PAYMENT_METHODS.map((m, i) => `<label class="ub-pay-option"><input type="radio" name="payment" value="${m.value}" ${(saved.payment ? saved.payment === m.value : i === 0) ? 'checked' : ''}><span><strong>${m.title}</strong><small>${m.desc}</small></span>${m.tag ? `<span class="tag">${m.tag}</span>` : '<span></span>'}</label>`).join('')}</div>
        <div id="wave-pay-note" class="wave-pay-note" style="display:flex;margin-top:14px"></div>
      </section>
    </div>

    <aside class="ub-co-summary">
      <h3>Récapitulatif</h3>
      <div class="ub-co-mini-lines" id="co-mini-lines"></div>
      <div class="summary-row"><span>Sous-total</span><span id="subtotal-value"></span></div>
      <div class="summary-row"><span>Livraison <small id="ship-zone" style="color:var(--ink-soft)"></small></span><span id="ship-value"></span></div>
      <div class="summary-row" id="discount-row" style="display:none;color:var(--success)"><span>Réduction (<span id="discount-code-label"></span>)</span><span id="discount-value"></span></div>
      ${hasPromos ? `<button type="button" class="ub-link-btn ub-promo-toggle" id="promo-toggle">Vous avez un code promo ?</button><div class="coupon-row" id="promo-row" style="display:none;margin:10px 0 0"><input type="text" id="co-promo" placeholder="Code promo" value="${appliedPromo ? appliedPromo.code : ''}"><button class="btn btn-outline btn-sm" type="button" onclick="ubApplyPromo()">Appliquer</button></div><p id="promo-msg" style="font-size:.72rem;margin:4px 0 0"></p>` : ''}
      <div class="summary-row total"><span>Total</span><span id="total-value"></span></div>
      <div class="deposit-box"><div class="summary-row"><span>À payer maintenant (Wave)</span><strong id="deposit-value"></strong></div><div class="summary-row"><span>À la livraison</span><span id="remainder-value"></span></div></div>
      <div id="checkout-error" class="checkout-error" style="display:none;margin-top:12px"></div>
      <button class="btn btn-primary btn-block ub-co-cta" id="checkout-submit" onclick="ubSubmitOrder()">${ubIcon('shield')} <span id="checkout-submit-label">Valider ma commande</span></button>
      <div class="ub-co-trust">
        <div>${ubIcon('shield')} Paiement vérifié manuellement par notre équipe</div>
        <div>${ubIcon('truck')} Préparée sous 24 à 48h · suivi WhatsApp</div>
        <div>${ubIcon('return')} Retour possible sous 7 jours</div>
      </div>
      <a class="ub-help-wa" id="help-wa" target="_blank" rel="noopener" href="#">${ubIcon('whatsapp')}<span><strong>Une question avant de valider ?</strong>Une conseillère vous répond sur WhatsApp.</span></a>
    </aside>
  </div>`;

  const bind = (id, key) => document.getElementById(id).addEventListener('input', e => { ubSaveCustomerField(key, e.target.value.trim()); ubClearFieldError(e.target); ubUpdateSteps(); ubQueueCartSessionSave(); ubMaybeTrackInfo(); });
  bind('co-name', 'name'); bind('co-phone', 'phone'); bind('co-address', 'address');
  document.getElementById('co-zone').addEventListener('change', e => { ubSaveCustomerField('zoneId', e.target.value); ubRecalcSummary(); ubQueueCartSessionSave(); });
  document.querySelectorAll('input[name="payment"]').forEach(r => r.addEventListener('change', e => { ubSaveCustomerField('payment', e.target.value); ubRecalcSummary(); }));
  const promoToggle = document.getElementById('promo-toggle');
  if(promoToggle) promoToggle.addEventListener('click', () => { document.getElementById('promo-row').style.display = 'flex'; promoToggle.style.display = 'none'; document.getElementById('co-promo').focus(); });

  ubTrackOncePerDay('checkout_start');
  ubMaybeTrackInfo();
  ubRefreshCart();
  ubWatchMobileCta();
}

/* Met a jour les lignes, le recap et les suggestions sans toucher au formulaire
   (la cliente ne perd jamais ce qu'elle a saisi en changeant une quantite). */
function ubRefreshCart(){
  if(orderDone || !catalog) return;
  const cart = ubGetCart();
  if(!cart.length){ renderCart(); return; }
  if(!document.getElementById('co-lines')){ renderCart(); return; }
  const sum = ubComputeCartSummary(cart, catalog.productsById, catalog.templatesById);
  currentSum = sum;
  currentLines = [...sum.boxes.flatMap(b => b.items), ...sum.regular];
  currentSubtotal = sum.subtotal;
  if(!sum.count){ document.getElementById('cart-content').innerHTML = ubEmptyCartHTML(); ubToggleMobileCta(false); return; }

  document.getElementById('co-count').textContent = `${sum.count} article${sum.count > 1 ? 's' : ''}`;
  document.getElementById('co-ship-progress').innerHTML = ubFreeShippingHTML(sum.subtotal);
  document.getElementById('co-lines').innerHTML =
    sum.boxes.map(b => `<div class="ub-co-line"><div class="ub-drawer-thumb is-box">${ubIcon('box')}</div><div class="ub-co-line-info"><strong>Box cadeau — ${ubEscapeHtml(b.label || '')}</strong>${!b.available ? '<small style="color:var(--danger)">Indisponible, merci de la retirer</small>' : ''}<small>${b.items.map(l => l.product.name).join(', ')}</small><div class="ub-co-line-actions"><button class="ub-link-btn" type="button" onclick="ubRemoveBoxFromCart('${b.instanceId}')">Retirer</button></div></div><div class="ub-co-line-price"><b>${ubFormatPrice(b.price)}</b></div></div>`).join('')
    + sum.regular.map(l => {
      const needsNote = l.product.requiresClientNote || l.product.requiresPhoto, missing = ubLineMissing(l);
      const hasNote = !!(l.clientNote || l.clientPhotoPath) && missing !== 'photo';
      const maxed = l.product.stock != null && l.qty >= l.product.stock;
      const key = ubLineKey(l);
      const noteLabel = hasNote ? (l.clientPhotoPath ? 'Photo jointe — modifier' : 'Info fournie — modifier') : (l.product.requiresPhoto ? 'Photo de peau requise' : 'Info requise avant validation');
      return `<div class="ub-co-line"><a href="produit.html?id=${l.id}"><img src="${l.product.img}" alt="${ubEscapeHtml(l.product.name)}"></a><div class="ub-co-line-info"><a href="produit.html?id=${l.id}"><strong>${l.product.name}</strong></a>${l.shade ? ubShadeTagHTML(l.product, l.shade) : (missing === 'teinte' ? `<a class="ub-note-btn" href="produit.html?id=${l.id}">${ubIcon('droplet')} Choisir la teinte</a>` : '')}<small>${ubFormatPrice(l.product.price)} l'unité${l.product.stock > 0 && l.product.stock <= 5 ? ` · <span style="color:var(--warning)">plus que ${l.product.stock} en stock</span>` : ''}${l.product.stock <= 0 ? ' · <span style="color:var(--danger)">épuisé, à retirer</span>' : ''}</small><div class="ub-co-line-actions"><div class="qty-selector qty-sm"><button type="button" aria-label="Retirer un" onclick="ubUpdateLine('${key}',${l.qty - 1})">−</button><span>${l.qty}</span><button type="button" aria-label="Ajouter un" ${maxed ? 'disabled' : ''} onclick="ubUpdateLine('${key}',${l.qty + 1})">+</button></div><button class="ub-link-btn" type="button" onclick="ubUpdateLine('${key}',0)">Retirer</button>${needsNote ? `<button type="button" class="ub-note-btn ${hasNote ? 'is-ok' : ''}" onclick="ubOpenNoteModal('${key}')">${hasNote ? ubIcon('check') : ubIcon('camera')} ${noteLabel}</button>` : ''}</div></div><div class="ub-co-line-price"><b>${ubFormatPrice(l.product.price * l.qty)}</b>${l.product.oldPrice ? `<del>${ubFormatPrice(l.product.oldPrice * l.qty)}</del>` : ''}</div></div>`;
    }).join('');
  document.getElementById('co-mini-lines').innerHTML =
    sum.boxes.map(b => `<div class="ub-co-mini-line"><i></i><span>Box — ${ubEscapeHtml(b.label || '')}</span><b>${ubFormatPrice(b.price)}</b></div>`).join('')
    + sum.regular.map(l => `<div class="ub-co-mini-line"><img src="${l.product.img}" alt=""><span>${l.product.name}${l.shade ? ` · ${ubEscapeHtml(l.shade)}` : ''} <em>× ${l.qty}</em></span><b>${ubFormatPrice(l.product.price * l.qty)}</b></div>`).join('');

  const suggestions = ubCartSuggestions(cart, catalog.products, sum.subtotal, 3);
  document.getElementById('upsell-section').style.display = suggestions.length ? '' : 'none';
  document.getElementById('upsell-grid').innerHTML = suggestions.map(p => ubProductCardHTML(p, null)).join('');
  ubInitReveal();

  const helpText = `Bonjour Urbann Beauty, j'ai une question avant de valider ma commande :\n${sum.regular.map(l => `- ${l.product.name} x${l.qty}`).concat(sum.boxes.map(b => `- Box cadeau ${b.label || ''}`)).join('\n')}\nTotal panier : ${ubFormatPrice(sum.subtotal)}`;
  document.getElementById('help-wa').href = `https://wa.me/${UB_CONTACT.whatsapp}?text=${encodeURIComponent(helpText)}`;
  document.getElementById('help-wa').onclick = () => ubTrack('whatsapp_click');
  ubSetWhatsAppContext(helpText);

  ubRecalcSummary();
  ubQueueCartSessionSave();
}

function ubRecalcSummary(){
  const zone = ubSelectedZone();
  const pickupHint = document.getElementById('pickup-hint');
  const addressLabel = document.getElementById('address-label');
  const addressInput = document.getElementById('co-address');
  if(!addressInput) return;
  if(pickupHint) pickupHint.style.display = zone && zone.isPickup ? 'block' : 'none';
  addressLabel.textContent = zone && zone.isPickup ? 'Précision (heure de passage souhaitée...)' : 'Adresse précise (quartier, repère...)';
  addressInput.placeholder = zone && zone.isPickup ? 'Ex : je passerai en fin de journée' : 'Ex : Villa 12, Cité Keur Gorgui';

  const discount = ubDiscountAmount(), shipping = ubShippingAmount(), total = ubCurrentTotal(), dueNow = ubAmountDueNow();
  document.getElementById('subtotal-value').textContent = ubFormatPrice(currentSubtotal);
  document.getElementById('ship-zone').textContent = zone ? `(${zone.name})` : '';
  document.getElementById('ship-value').innerHTML = shipping === 0 ? '<span style="color:var(--success);font-weight:600">Offerte</span>' : ubFormatPrice(shipping);
  document.getElementById('total-value').textContent = ubFormatPrice(total);
  document.getElementById('deposit-value').textContent = ubFormatPrice(dueNow);
  document.getElementById('remainder-value').textContent = total - dueNow > 0 ? ubFormatPrice(total - dueNow) : 'Rien';
  document.getElementById('checkout-submit-label').textContent = `Valider ma commande · ${ubFormatPrice(dueNow)}`;
  document.getElementById('mobile-cta-amount').textContent = ubFormatPrice(dueNow);
  const discountRow = document.getElementById('discount-row');
  if(appliedPromo){
    discountRow.style.display = 'flex';
    document.getElementById('discount-code-label').textContent = appliedPromo.code;
    document.getElementById('discount-value').textContent = '−' + ubFormatPrice(discount);
  } else discountRow.style.display = 'none';
  ubTogglePaymentNote();
  ubUpdateSteps();
}

function ubApplyPromo(){
  const input = document.getElementById('co-promo'), msg = document.getElementById('promo-msg');
  const code = (input.value || '').trim().toUpperCase();
  if(!code){ msg.textContent = 'Merci de saisir un code promo.'; msg.style.color = 'var(--danger)'; return; }
  const promo = availablePromoCodes[code];
  if(!promo){ appliedPromo = null; msg.textContent = 'Ce code promo n\'est pas valide.'; msg.style.color = 'var(--danger)'; ubRecalcSummary(); return; }
  appliedPromo = { code, ...promo };
  msg.textContent = `Code ${code} appliqué : ${promo.label || '-' + promo.percent + '%'}.`;
  msg.style.color = 'var(--success)';
  ubRecalcSummary();
}

function ubCopyWaveAmount(amount){
  const done = () => {
    const btn = document.getElementById('wave-copy-btn');
    if(!btn) return;
    btn.textContent = 'Copié ✓';
    setTimeout(() => { btn.textContent = 'Copier'; }, 2000);
  };
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(String(amount)).then(done).catch(() => ubShowToast('Impossible de copier, notez le montant manuellement'));
  } else ubShowToast('Copie non supportée, notez le montant manuellement');
}

function ubTogglePaymentNote(){
  const note = document.getElementById('wave-pay-note');
  if(!note) return;
  const total = ubCurrentTotal(), isDeposit = ubSelectedPayment() === 'Paiement à la livraison';
  const amountToPay = isDeposit ? ubDepositAmount(total) : total;
  note.style.flexDirection = 'column';
  note.innerHTML = `
    <div class="wave-amount-box"><div><span>${isDeposit ? 'Acompte à payer sur Wave (20%)' : 'Montant exact à payer sur Wave'}</span><strong>${ubFormatPrice(amountToPay)}</strong></div><button type="button" id="wave-copy-btn" class="btn btn-outline btn-sm" onclick="ubCopyWaveAmount(${amountToPay})">Copier</button></div>
    ${isDeposit ? `<p style="margin:2px 0 0;font-size:.76rem">Le solde de <strong>${ubFormatPrice(total - amountToPay)}</strong> sera réglé à la livraison.</p>` : ''}
    <ol class="ub-wave-steps">
      <li><span>Ouvrez Wave et payez <strong>${ubFormatPrice(amountToPay)}</strong> :<br><a class="ub-wave-btn" href="${UB_WAVE_PAYMENT_LINK}?amount=${amountToPay}" target="_blank" rel="noopener">Payer avec Wave ↗</a></span></li>
      <li><span>Faites une capture d'écran de la confirmation Wave.</span></li>
      <li><span>Joignez-la ici, puis validez votre commande.</span></li>
    </ol>
    <div class="proof-zone" id="proof-zone">
      <label class="proof-upload ${wavePaymentProofPath ? 'is-ok' : ''}" for="wave-proof-input" id="proof-upload-label">
        ${wavePaymentProofPath ? `${ubIcon('check')} Capture jointe — touchez pour la remplacer` : `${ubIcon('camera')} Joindre la capture de la transaction Wave *`}
      </label>
      <input type="file" id="wave-proof-input" accept="image/*" hidden>
      <p style="font-size:.72rem;color:var(--ink-soft);margin:6px 0 0">Obligatoire : notre équipe vérifie chaque paiement avant de préparer la commande.</p>
    </div>`;
  document.getElementById('wave-proof-input').addEventListener('change', async e => {
    const file = e.target.files[0];
    if(!file) return;
    const label = document.getElementById('proof-upload-label');
    label.textContent = 'Envoi de la capture...';
    const path = await ubUploadPaymentProof(file);
    if(!path){ ubShowToast("Échec de l'envoi, réessayez"); label.innerHTML = `${ubIcon('camera')} Joindre la capture de la transaction Wave *`; return; }
    wavePaymentProofPath = path;
    label.classList.add('is-ok');
    label.innerHTML = `${ubIcon('check')} Capture jointe — touchez pour la remplacer`;
    ubUpdateSteps();
    ubQueueCartSessionSave();
  });
}

function ubUpdateLine(key, qty){ if(qty <= 0) ubRemoveFromCart(key); else ubSetQty(key, qty); }

let infoTracked = false;
function ubMaybeTrackInfo(){
  const v = ubFormValues();
  if(!infoTracked && v.name && ubPhoneValid(v.phone)){ infoTracked = true; ubTrackOncePerDay('checkout_info'); }
}

/* ---------- Barre mobile collante ---------- */
let ctaObserver = null;
function ubToggleMobileCta(show){
  document.getElementById('mobile-cta').classList.toggle('show', !!show);
  document.body.classList.toggle('has-sticky-bar', !!show);
}
function ubWatchMobileCta(){
  if(ctaObserver) ctaObserver.disconnect();
  const target = document.getElementById('checkout-submit');
  if(!target || !('IntersectionObserver' in window)) return;
  ctaObserver = new IntersectionObserver(([entry]) => ubToggleMobileCta(!orderDone && !entry.isIntersecting && entry.boundingClientRect.top > 0), { threshold: 0 });
  ctaObserver.observe(target);
}

/* ---------- Info demandee par certains produits (texte / photo) ---------- */
function ubOpenNoteModal(key){
  const line = currentLines.find(l => ubLineMatches(l, key));
  if(!line) return;
  const product = line.product;
  const photoRequired = !!product.requiresPhoto;
  const overlay = document.getElementById('note-overlay'), body = document.getElementById('note-modal-body');
  let photoPath = line.clientPhotoPath || null;
  const prompt = product.clientNotePrompt || (photoRequired
    ? "Prenez une photo de votre visage ou de votre cou, à la lumière du jour et sans maquillage. Notre équipe vérifie avec elle que la teinte choisie vous correspond avant l'envoi."
    : "Merci de préciser ce dont vous avez besoin pour ce produit.");
  const emptyZone = `${ubIcon('camera')}<br>${photoRequired ? 'Prendre ou joindre une photo *' : 'Joindre une photo (optionnel si vous précisez par texte)'}`;
  overlay.classList.add('open');
  overlay.onclick = e => { if(e.target === overlay) overlay.classList.remove('open'); };
  body.innerHTML = `<button class="note-close" onclick="document.getElementById('note-overlay').classList.remove('open')">${ubIcon('close')}</button>
    <h3>${product.name}</h3>
    ${line.shade ? ubShadeTagHTML(product, line.shade) : ''}
    <p style="color:var(--ink-soft);font-size:.85rem;margin:6px 0 0">${prompt}</p>
    <label class="note-photo-zone" for="note-photo-input" id="note-photo-zone">
      ${photoPath ? `${ubIcon('check')} Photo jointe — touchez pour la remplacer` : emptyZone}
    </label>
    <input type="file" id="note-photo-input" accept="image/*" capture="user" hidden>
    <textarea id="note-text" rows="2" placeholder="${photoRequired ? 'Une précision ? (optionnel)' : 'Votre précision (optionnel si vous joignez une photo)'}">${ubEscapeHtml(line.clientNote || '')}</textarea>
    <div style="display:flex;gap:10px;justify-content:flex-end;margin-top:16px">
      <button class="btn" type="button" onclick="document.getElementById('note-overlay').classList.remove('open')">Annuler</button>
      <button class="btn btn-primary" type="button" id="note-save">Enregistrer</button>
    </div>`;
  document.getElementById('note-photo-input').addEventListener('change', async e => {
    const file = e.target.files[0];
    if(!file) return;
    const zone = document.getElementById('note-photo-zone');
    zone.innerHTML = 'Envoi de la photo...';
    const path = await ubUploadClientPhoto(file);
    if(!path){ ubShowToast("Échec de l'envoi de la photo, réessayez"); zone.innerHTML = emptyZone; return; }
    photoPath = path;
    zone.innerHTML = `<img src="${URL.createObjectURL(file)}" alt="Votre photo"><span style="display:block;margin-top:6px">${ubIcon('check')} Photo jointe — touchez pour la remplacer</span>`;
  });
  document.getElementById('note-save').addEventListener('click', () => {
    const note = document.getElementById('note-text').value.trim();
    if(photoRequired && !photoPath){ ubShowToast('La photo est obligatoire pour ce produit.'); return; }
    if(!note && !photoPath){ ubShowToast('Merci de préciser par texte ou de joindre une photo.'); return; }
    ubSetCartLineNote(key, note, photoPath);
    overlay.classList.remove('open');
  });
}

/* ---------- Validation ---------- */
function ubClearFieldError(input){ input.closest('.field')?.classList.remove('has-error'); }
function ubFocusError(fieldId, inputId, msg){
  const field = document.getElementById(fieldId);
  if(field){
    field.classList.add('has-error');
    const hint = field.querySelector('.field-hint');
    if(hint){ hint.textContent = msg; hint.style.display = 'block'; }
  }
  const input = document.getElementById(inputId);
  if(input){ input.scrollIntoView({ behavior: 'smooth', block: 'center' }); setTimeout(() => input.focus({ preventScroll: true }), 350); }
}
function ubShowCheckoutError(msg, scrollTarget){
  const errBox = document.getElementById('checkout-error');
  errBox.textContent = msg;
  errBox.style.display = 'block';
  const target = document.getElementById(scrollTarget) || errBox;
  target.scrollIntoView({ behavior: 'smooth', block: 'center' });
  target.classList.remove('ub-co-error-focus'); void target.offsetWidth; target.classList.add('ub-co-error-focus');
}

async function ubSubmitOrder(){
  const btn = document.getElementById('checkout-submit'), errBox = document.getElementById('checkout-error');
  if(!btn) return;
  errBox.style.display = 'none';
  const { name, phone, address: addressDetail } = ubFormValues();
  const zone = ubSelectedZone();
  const address = zone ? (addressDetail ? `${zone.name}, ${addressDetail}` : zone.name) : addressDetail;
  const payment = ubSelectedPayment();

  if(!currentLines.length) return ubShowCheckoutError('Votre panier est vide.');
  const soldOut = currentLines.find(l => !l.boxInstanceId && l.product.stock <= 0);
  if(soldOut) return ubShowCheckoutError(`"${soldOut.product.name}" est épuisé : merci de le retirer du panier.`, 'co-step-cart');
  const missingNote = ubMissingNoteLine();
  if(missingNote){
    const what = ubLineMissing(missingNote);
    return ubShowCheckoutError(what === 'teinte' ? `Choisissez la teinte de "${missingNote.product.name}" sur sa fiche produit.`
      : what === 'photo' ? `Joignez une photo de votre peau pour "${missingNote.product.name}" (bouton « Photo de peau requise » sur la ligne) : elle nous permet de valider la teinte.`
      : `Merci de renseigner l'info demandée pour "${missingNote.product.name}" (bouton sur la ligne du produit).`, 'co-step-cart');
  }
  if(!name){ ubShowCheckoutError('Merci de renseigner votre nom complet.'); return ubFocusError('f-name', 'co-name', 'Votre nom est nécessaire pour la livraison.'); }
  if(!ubPhoneValid(phone)){ ubShowCheckoutError('Merci de renseigner un numéro de téléphone valide.'); return ubFocusError('f-phone', 'co-phone', 'Numéro invalide : 9 chiffres minimum (ex : 77 000 00 00).'); }
  if(!zone) return ubShowCheckoutError('Merci de choisir votre zone de livraison.', 'co-step-info');
  if(!wavePaymentProofPath){
    return ubShowCheckoutError(payment === 'Paiement à la livraison'
      ? `Joignez la capture Wave de votre acompte de ${ubFormatPrice(ubDepositAmount())} pour valider (étape 3).`
      : `Joignez la capture Wave de votre paiement de ${ubFormatPrice(ubCurrentTotal())} pour valider (étape 3).`, 'proof-zone');
  }

  btn.disabled = true;
  document.getElementById('checkout-submit-label').textContent = 'Envoi de votre commande...';
  const result = await ubPlaceOrder({
    clientName: name, phone, address, paymentMethod: payment,
    items: currentLines.map(l => ({ id: l.product.id, qty: l.qty, shade: l.shade || null, boxInstanceId: l.boxInstanceId, boxTemplateId: l.boxTemplateId, clientNote: l.clientNote, clientPhotoPath: l.clientPhotoPath })),
    promoCode: appliedPromo ? appliedPromo.code : null,
    deliveryZoneId: zone.id,
    paymentProofPath: wavePaymentProofPath,
  });
  btn.disabled = false;

  if(result.error){
    ubRecalcSummary();
    if(result.error === 'PRODUIT_INDISPONIBLE'){
      const p = currentLines.find(l => l.product.id === result.productId)?.product;
      ubShowCheckoutError(`Stock insuffisant pour "${p ? p.name : result.productId}" : ajustez la quantité ou retirez ce produit du panier.`, 'co-step-cart');
    } else if(result.error === 'PANIER_VIDE') ubShowCheckoutError('Votre panier est vide.');
    else if(result.error === 'NOM_CLIENT_REQUIS') ubShowCheckoutError('Merci de renseigner votre nom complet.');
    else if(result.error === 'TELEPHONE_REQUIS') ubShowCheckoutError('Merci de renseigner votre numéro de téléphone.');
    else if(result.error === 'BOX_INVALIDE') ubShowCheckoutError("Une box cadeau de votre panier n'est plus disponible ou a été modifiée entre-temps. Merci de retirer la box et de la recomposer.", 'co-step-cart');
    else if(result.error === 'TEINTE_REQUISE' || result.error === 'PHOTO_REQUISE'){
      const p = currentLines.find(l => l.product.id === result.productId)?.product;
      ubShowCheckoutError(result.error === 'TEINTE_REQUISE' ? `Choisissez une teinte disponible pour "${p ? p.name : 'le fond de teint'}" sur sa fiche produit.` : `Joignez une photo de votre peau pour "${p ? p.name : 'le fond de teint'}" avant de valider.`, 'co-step-cart');
    }
    else if(result.error === 'PREUVE_PAIEMENT_REQUISE') ubShowCheckoutError("Merci de joindre la capture d'écran de la transaction Wave : sans cette preuve, la commande ne peut pas être validée.", 'proof-zone');
    else ubShowCheckoutError("Une erreur est survenue lors de l'enregistrement de votre commande. Merci de réessayer dans un instant, ou contactez-nous sur WhatsApp.");
    return;
  }

  const finalTotal = ubCurrentTotal();
  const depositPaid = payment === 'Paiement à la livraison' ? ubDepositAmount(finalTotal) : finalTotal;
  const remainderDue = finalTotal - depositPaid;
  const orderedLines = currentLines;
  orderDone = true;
  ubTrack('order_placed', { value: finalTotal });
  ubSaveCustomerField('name', name); ubSaveCustomerField('phone', phone); ubSaveCustomerField('zoneId', String(zone.id));
  try { localStorage.removeItem('ub_cart_sid'); } catch(e) {}
  ubSaveCart([]);
  appliedPromo = null;
  wavePaymentProofPath = null;
  ubToggleMobileCta(false);
  document.getElementById('upsell-section').style.display = 'none';

  /* Recapitulatif envoye a la boutique sur WhatsApp : la commande arrive aussi
     directement dans la messagerie de l'equipe, avec tout le necessaire. */
  const itemsList = orderedLines.map(l => `- ${l.product.name}${l.shade ? ` — teinte ${l.shade}` : ''} x${l.qty}${l.boxLabel ? ` (Box ${l.boxLabel})` : ''}${l.clientPhotoPath ? ' (photo jointe)' : ''}`).join('\n');
  const amountsBlock = payment === 'Paiement à la livraison'
    ? `Acompte réglé via Wave : ${ubFormatPrice(depositPaid)}\nSolde à régler à la livraison : ${ubFormatPrice(remainderDue)}`
    : `Montant réglé via Wave : ${ubFormatPrice(finalTotal)}`;
  const waText = (zone.isPickup ? `Nouvelle commande à RETIRER EN MAGASIN — ${result.orderId}\n` : `Nouvelle commande ${result.orderId} — ${zone.name}\n`)
    + `Client : ${name}\nTéléphone : ${phone}\n`
    + (zone.isPickup ? '' : `Adresse : ${addressDetail || 'à préciser'}\n`)
    + `\nArticles :\n${itemsList}\n\nMontant total : ${ubFormatPrice(finalTotal)}\n${amountsBlock}`;
  const waLink = `https://wa.me/${UB_CONTACT.whatsapp}?text=${encodeURIComponent(waText)}`;
  const trackLink = `suivi.html?order=${encodeURIComponent(result.orderId)}&phone=${encodeURIComponent(phone)}`;
  const handoffMsg = zone.whatsappHandoff
    ? (zone.isPickup
      ? `Vous pourrez récupérer votre commande à : <strong>${UB_CONTACT.pickupAddress}</strong>. Envoyez-nous le récapitulatif sur WhatsApp pour convenir de l'heure.`
      : `La livraison (${ubEscapeHtml(zone.name)}) s'organise directement sur WhatsApp : envoyez-nous le récapitulatif pour caler la remise.`)
    : `Envoyez-nous le récapitulatif sur WhatsApp pour accélérer la validation de votre paiement.`;

  document.getElementById('cart-content').innerHTML = `
    <div class="ub-confirm">
      <div class="ub-confirm-icon">${ubIcon('check')}</div>
      <h2 style="margin:0">Merci ${ubEscapeHtml(name.split(' ')[0])}, commande reçue !</h2>
      <div class="ub-confirm-id">${result.orderId}</div>
      <p style="color:var(--ink-soft)">${payment === 'Paiement à la livraison'
        ? `Acompte de <strong>${ubFormatPrice(depositPaid)}</strong> reçu via Wave — solde de <strong>${ubFormatPrice(remainderDue)}</strong> à la livraison.`
        : `Paiement de <strong>${ubFormatPrice(finalTotal)}</strong> reçu via Wave.`}</p>
      <p style="color:var(--ink-soft)">${handoffMsg}</p>
      <div class="ub-confirm-actions">
        <a href="${waLink}" target="_blank" rel="noopener" class="btn btn-primary btn-wa" onclick="ubTrack('whatsapp_click')">${ubIcon('whatsapp')} Envoyer sur WhatsApp</a>
        <a href="${trackLink}" class="btn btn-outline">${ubIcon('truck')} Suivre ma commande</a>
      </div>
      <div class="ub-confirm-next">
        <h4>Et maintenant ?</h4>
        <ol class="ub-wave-steps" style="margin:0">
          <li><span>Notre équipe vérifie votre capture Wave (en général en moins d'une heure, 9h–20h).</span></li>
          <li><span>Nous vous confirmons la commande au <strong>${ubEscapeHtml(phone)}</strong> sur WhatsApp.</span></li>
          <li><span>${zone.isPickup ? 'Vous passez la récupérer au point de retrait.' : 'Votre colis est préparé sous 24 à 48h puis livré dans votre zone.'}</span></li>
        </ol>
      </div>
      <a href="boutique.html" style="font-size:.84rem;color:var(--mauve-600)">Continuer mes achats →</a>
    </div>`;
  window.scrollTo({ top: 0, behavior: 'smooth' });
  if(zone.whatsappHandoff) window.open(waLink, '_blank');
}

window.addEventListener('ub:cart', () => ubRefreshCart());
renderCart();
</script></body></html>
