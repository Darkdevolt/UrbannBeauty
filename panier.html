<!DOCTYPE html><html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Panier — Urbann Beauty</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="assets/css/style.css"><link rel="stylesheet" href="assets/css/pages.css">
<style>
.note-overlay{position:fixed;inset:0;background:rgba(36,27,46,.55);display:none;align-items:center;justify-content:center;z-index:200;padding:16px}
.note-overlay.open{display:flex}
.note-modal{background:var(--white);border-radius:var(--radius-lg);max-width:440px;width:100%;max-height:90vh;overflow:auto;padding:24px}
.note-modal h3{margin:0 0 4px}
.note-close{float:right;background:none;border:0;cursor:pointer;color:var(--ink-soft)}
.note-modal textarea{width:100%;border:1px solid var(--line);border-radius:var(--radius-sm);padding:10px 12px;font:inherit;margin-top:12px;resize:vertical}
.note-photo-zone{display:block;border:2px dashed var(--mauve-200);border-radius:var(--radius-md);padding:20px;text-align:center;cursor:pointer;margin-top:12px;font-size:.84rem}
.note-photo-zone svg{width:24px;height:24px;color:var(--mauve-500);margin-bottom:4px}
.proof-zone{margin-top:6px}
.proof-upload{display:flex;align-items:center;gap:8px;border:2px dashed var(--mauve-300);border-radius:var(--radius-sm);padding:12px 14px;cursor:pointer;font-size:.82rem;font-weight:600;color:var(--mauve-700);background:var(--mauve-50)}
.proof-upload svg{width:18px;height:18px;flex-shrink:0}
.note-photo-zone img{max-width:100%;max-height:160px;border-radius:8px;display:block;margin:0 auto}
</style>
<link rel="icon" type="image/png" href="https://tbowuuxvjaadawhmpumr.supabase.co/storage/v1/object/public/media/logo.png"></head><body>
<div id="site-header"></div><div class="breadcrumb"><div class="container"><a href="index.html">Accueil</a><span>/</span><span>Panier</span></div></div>
<section style="padding-top:48px"><div class="container"><div class="section-head" style="text-align:left;margin-bottom:36px"><span class="eyebrow">Votre sélection</span><h2>Mon panier</h2><p>Vérifiez votre sélection avant de finaliser votre commande.</p></div><div id="cart-content"></div></div></section><div id="site-footer"></div>
<div class="note-overlay" id="note-overlay"><div class="note-modal" id="note-modal-body"></div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script><script src="assets/js/icons.js"></script><script src="assets/js/data.js"></script><script src="assets/js/media.js"></script><script src="assets/js/main.js"></script>
<script>
ubRenderHeader('boutique');ubRenderFooter();

const UB_PAYMENT_METHODS = ['Wave', 'Paiement à la livraison'];
const UB_WAVE_PAYMENT_LINK = 'https://pay.wave.com/m/M_sn_DP533wZ-yIia/c/sn/';
let currentLines = [];
let currentZones = [];
let currentSubtotal = 0;
let appliedPromo = null;
let availablePromoCodes = {}; // rempli depuis l'admin (promo_codes), vide par defaut
let wavePaymentProofPath = null; // capture d'ecran Wave jointe, obligatoire avant de valider

function ubCurrentZoneFee(){
  const id = document.getElementById('co-zone')?.value;
  const zone = currentZones.find(z => String(z.id) === id) || currentZones[0];
  return zone ? zone.fee : 2500;
}

function ubDiscountAmount(){
  return appliedPromo ? Math.round(currentSubtotal * appliedPromo.percent / 100) : 0;
}

const UB_DEPOSIT_RATE = 0.2;
function ubCurrentTotal(){
  const discount = ubDiscountAmount();
  const shipping = (currentSubtotal - discount) >= 50000 ? 0 : ubCurrentZoneFee();
  return currentSubtotal - discount + shipping;
}
function ubDepositAmount(total){
  return Math.ceil((total != null ? total : ubCurrentTotal()) * UB_DEPOSIT_RATE);
}

function ubRecalcSummary(){
  const discount = ubDiscountAmount();
  const shipping = (currentSubtotal - discount) >= 50000 ? 0 : ubCurrentZoneFee();
  const total = currentSubtotal - discount + shipping;
  const deposit = ubDepositAmount(total);
  const shipEl = document.getElementById('ship-value'), totalEl = document.getElementById('total-value'), hintEl = document.getElementById('ship-hint');
  const discountRow = document.getElementById('discount-row'), discountValueEl = document.getElementById('discount-value'), discountLabelEl = document.getElementById('discount-code-label');
  const depositEl = document.getElementById('deposit-value'), remainderEl = document.getElementById('remainder-value');
  if(shipEl) shipEl.textContent = shipping === 0 ? 'Offerte' : ubFormatPrice(shipping);
  if(totalEl) totalEl.textContent = ubFormatPrice(total);
  if(hintEl) hintEl.textContent = shipping > 0 ? 'Livraison offerte dès 50 000 FCFA.' : 'Vous bénéficiez de la livraison offerte.';
  if(depositEl) depositEl.textContent = ubFormatPrice(deposit);
  if(remainderEl) remainderEl.textContent = ubFormatPrice(total - deposit);
  if(discountRow){
    if(appliedPromo){
      discountRow.style.display='flex';
      discountLabelEl.textContent=appliedPromo.label;
      discountValueEl.textContent='−'+ubFormatPrice(discount);
    } else {
      discountRow.style.display='none';
    }
  }
  ubTogglePaymentNote();
}

function ubApplyPromo(){
  const input=document.getElementById('co-promo'), msg=document.getElementById('promo-msg');
  const code=(input.value||'').trim().toUpperCase();
  if(!code){ msg.textContent='Merci de saisir un code promo.'; msg.style.color='var(--danger)'; return; }
  const promo=availablePromoCodes[code];
  if(!promo){ appliedPromo=null; msg.textContent='Ce code promo n\'est pas valide.'; msg.style.color='var(--danger)'; ubRecalcSummary(); return; }
  appliedPromo={ code, ...promo };
  msg.textContent=`Code ${code} appliqué : ${promo.label}.`;
  msg.style.color='var(--success)';
  ubRecalcSummary();
}

function ubCopyWaveAmount(amount){
  const text = String(amount);
  const done = () => {
    const btn = document.getElementById('wave-copy-btn');
    if(!btn) return;
    const original = btn.dataset.label || btn.textContent;
    btn.dataset.label = original;
    btn.textContent = 'Montant copié ✓';
    setTimeout(() => { btn.textContent = original; }, 2000);
  };
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(done).catch(()=>ubShowToast('Impossible de copier, notez le montant manuellement'));
  } else {
    ubShowToast('Copie non supportée, notez le montant manuellement');
  }
}

function ubTogglePaymentNote(){
  const selected = document.querySelector('input[name="payment"]:checked')?.value;
  const note = document.getElementById('wave-pay-note');
  if(!note) return;
  const total = ubCurrentTotal();
  const deposit = ubDepositAmount(total);
  const isDeposit = selected === 'Paiement à la livraison';
  const amountToPay = isDeposit ? deposit : total;
  const amountBox = `<div class="wave-amount-box"><div><span>Montant exact à payer sur Wave</span><strong>${ubFormatPrice(amountToPay)}</strong></div><button type="button" id="wave-copy-btn" class="btn btn-outline btn-sm" onclick="ubCopyWaveAmount(${amountToPay})">Copier le montant</button></div>`;
  const proofZone = `<div class="proof-zone" id="proof-zone">
    <label class="proof-upload" for="wave-proof-input" id="proof-upload-label">
      ${wavePaymentProofPath ? `${ubIcon('check')} Capture jointe — touchez pour la remplacer` : `${ubIcon('camera')} Joindre la capture d'écran de la transaction Wave *`}
    </label>
    <input type="file" id="wave-proof-input" accept="image/*" hidden>
    <p style="font-size:.72rem;color:var(--ink-soft);margin:6px 0 0">Obligatoire : sans cette preuve, la commande ne peut pas être validée.</p>
  </div>`;
  note.style.display='flex';
  note.style.flexDirection='column';
  if(isDeposit){
    note.innerHTML = amountBox + `<span>Cet acompte (20% minimum) est obligatoire pour valider la commande. Le solde de <strong>${ubFormatPrice(total-deposit)}</strong> sera réglé à la livraison. Ouvrez Wave et collez le montant copié ci-dessus, via ce lien : </span><a href="${UB_WAVE_PAYMENT_LINK}" target="_blank" rel="noopener">${UB_WAVE_PAYMENT_LINK}</a>` + proofZone;
  } else {
    note.innerHTML = amountBox + `<span>Ouvrez Wave et collez le montant copié ci-dessus, via ce lien : </span><a href="${UB_WAVE_PAYMENT_LINK}" target="_blank" rel="noopener">${UB_WAVE_PAYMENT_LINK}</a>` + proofZone;
  }
  document.getElementById('wave-proof-input').addEventListener('change', async e=>{
    const file = e.target.files[0];
    if(!file) return;
    const label = document.getElementById('proof-upload-label');
    label.textContent = 'Envoi de la capture...';
    const path = await ubUploadPaymentProof(file);
    if(!path){ ubShowToast("Échec de l'envoi, réessayez"); label.innerHTML = `${ubIcon('camera')} Joindre la capture d'écran de la transaction Wave *`; return; }
    wavePaymentProofPath = path;
    label.innerHTML = `${ubIcon('check')} Capture jointe — touchez pour la remplacer`;
  });
}

async function renderCart(){
  const cart=ubGetCart(), container=document.getElementById('cart-content');
  if(!cart.length){
    container.innerHTML=`<div class="empty-cart">${ubIcon('bag')}<h3>Votre panier est vide</h3><p style="color:var(--ink-soft)">Vous n’avez encore rien ajouté. Découvrez nos soins et trouvez vos essentiels.</p><a href="boutique.html" class="btn btn-primary">Découvrir la boutique</a></div>`;
    currentLines=[];
    return;
  }
  const [allProducts, allCategories, zones, boxTemplates, promoCodes] = await Promise.all([ubGetAllProducts(), ubGetAllCategories(), ubGetDeliveryZones(), ubGetGiftBoxTemplates(), ubGetActivePromoCodes()]);
  const productsById=Object.fromEntries(allProducts.map(p=>[p.id,p])), catsById=ubCatsById(allCategories);
  const boxTemplatesById=Object.fromEntries(boxTemplates.map(t=>[t.id,t]));
  availablePromoCodes=Object.fromEntries(promoCodes.map(c=>[c.code.toUpperCase(),{percent:c.percent,label:c.label}]));
  const lines=cart.map(l=>({...l,product:productsById[l.id]})).filter(l=>l.product);
  currentLines=lines;
  currentZones=zones;

  const regularLines = lines.filter(l=>!l.boxInstanceId);
  const boxGroups = {};
  lines.filter(l=>l.boxInstanceId).forEach(l=>{
    if(!boxGroups[l.boxInstanceId]) boxGroups[l.boxInstanceId]=[];
    boxGroups[l.boxInstanceId].push(l);
  });
  const boxGroupList = Object.entries(boxGroups).map(([instanceId,items])=>{
    const tpl = boxTemplatesById[items[0].boxTemplateId];
    return { instanceId, items, label: items[0].boxLabel, price: tpl ? tpl.price : items.reduce((s,l)=>s+l.product.price,0), available: !!tpl };
  });

  const regularSubtotal = regularLines.reduce((s,l)=>s+l.product.price*l.qty,0);
  const boxSubtotal = boxGroupList.reduce((s,g)=>s+g.price,0);
  const subtotal = regularSubtotal + boxSubtotal;
  currentSubtotal=subtotal;
  const shipping=subtotal>=50000?0:(zones[0]?zones[0].fee:2500), total=subtotal+shipping;
  const boxRowsHTML = boxGroupList.map(g=>`<tr class="cart-box-row"><td colspan="3"><div class="cart-box-label">${ubIcon('bag')} <strong>Box Cadeau — ${g.label}</strong>${!g.available?' <span style="color:var(--danger)">(indisponible, à retirer)</span>':''}<span class="cart-box-items">${g.items.map(l=>l.product.name).join(', ')}</span></div></td><td><strong>${ubFormatPrice(g.price)}</strong></td><td><button class="remove-btn" aria-label="Retirer la box" onclick="ubRemoveBoxFromCart('${g.instanceId}');renderCart();">${ubIcon('trash')}</button></td></tr>`).join('');
  const regularRowsHTML = regularLines.map(l=>{
    const needsNote = l.product.requiresClientNote;
    const hasNote = !!(l.clientNote || l.clientPhotoPath);
    const noteBadge = needsNote ? `<button type="button" onclick="ubOpenNoteModal('${l.product.id}')" style="display:flex;align-items:center;gap:6px;margin-top:6px;font-size:.72rem;border:1px solid ${hasNote?'var(--success)':'var(--mauve-300)'};color:${hasNote?'var(--success)':'var(--mauve-600)'};background:${hasNote?'rgba(76,154,106,.08)':'var(--mauve-50)'};padding:5px 10px;border-radius:999px;cursor:pointer">${hasNote?ubIcon('check'):ubIcon('camera')} ${hasNote?'Info fournie — modifier':'Info requise avant validation'}</button>` : '';
    return `<tr><td><a href="produit.html?id=${l.product.id}" class="cart-product"><img src="${l.product.img}" alt="${l.product.name}"><div><strong>${l.product.name}</strong><span>${catsById[l.product.category]?.name||''}</span></div></a>${noteBadge}</td><td>${ubFormatPrice(l.product.price)}</td><td><div class="qty-selector"><button onclick="ubUpdateLine('${l.product.id}',${l.qty-1})">−</button><span>${l.qty}</span><button onclick="ubUpdateLine('${l.product.id}',${l.qty+1})">+</button></div></td><td><strong>${ubFormatPrice(l.product.price*l.qty)}</strong></td><td><button class="remove-btn" aria-label="Supprimer" onclick="ubRemoveFromCart('${l.product.id}');renderCart();">${ubIcon('trash')}</button></td></tr>`;
  }).join('');
  container.innerHTML=`<div class="cart-layout"><div><div class="cart-table-wrap"><table class="cart-table"><thead><tr><th>Produit</th><th>Prix</th><th>Quantité</th><th>Total</th><th></th></tr></thead><tbody>${boxRowsHTML}${regularRowsHTML}</tbody></table></div><a href="boutique.html" style="display:inline-block;margin-top:18px;font-size:.82rem;color:var(--mauve-600)">← Continuer mes achats</a></div><div class="cart-summary"><h3>Récapitulatif</h3><div class="summary-row"><span>Sous-total</span><span>${ubFormatPrice(subtotal)}</span></div><div class="summary-row"><span>Livraison</span><span id="ship-value">${shipping===0?'Offerte':ubFormatPrice(shipping)}</span></div><p id="ship-hint" style="font-size:.72rem;color:${shipping>0?'var(--ink-soft)':'var(--success)'}">${shipping>0?'Livraison offerte dès 50 000 FCFA.':'Vous bénéficiez de la livraison offerte.'}</p><div class="summary-row" id="discount-row" style="display:none;color:var(--success)"><span>Réduction (<span id="discount-code-label"></span>)</span><span id="discount-value"></span></div><div class="coupon-row"><input type="text" id="co-promo" placeholder="Code promo" value="${appliedPromo?appliedPromo.code:''}"><button class="btn btn-outline btn-sm" onclick="ubApplyPromo()">Appliquer</button></div><p id="promo-msg" style="font-size:.72rem;margin:2px 0 0"></p><div class="summary-row total"><span>Total</span><span id="total-value">${ubFormatPrice(total)}</span></div><div class="deposit-box"><div class="summary-row"><span>Acompte obligatoire (20%)</span><strong id="deposit-value">${ubFormatPrice(ubDepositAmount(total))}</strong></div><div class="summary-row"><span>Solde restant</span><span id="remainder-value">${ubFormatPrice(total-ubDepositAmount(total))}</span></div><p style="font-size:.7rem;color:var(--ink-soft);margin:4px 0 0">Un acompte minimum de 20% est requis pour valider toute commande, y compris en paiement à la livraison.</p></div><div class="checkout-form"><div class="field"><label>Nom complet *</label><input id="co-name" type="text" placeholder="Votre nom"></div><div class="field"><label>Téléphone *</label><input id="co-phone" type="tel" placeholder="77 000 00 00"></div><div class="field"><label>Zone de livraison *</label><select id="co-zone" onchange="ubRecalcSummary()">${zones.map((z,i)=>`<option value="${z.id}" ${i===0?'selected':''}>${z.name} — ${z.fee===0?'Gratuit':ubFormatPrice(z.fee)}</option>`).join('')}</select></div><div class="field"><label>Adresse précise (quartier, repère...)</label><input id="co-address" type="text" placeholder="Ex : Villa 12, Cité Keur Gorgui"></div><div class="field"><label>Mode de paiement *</label><div class="payment-methods">${UB_PAYMENT_METHODS.map((m,i)=>`<label class="payment-option"><input type="radio" name="payment" value="${m}" ${i===0?'checked':''} onchange="ubTogglePaymentNote()"><span>${m}</span></label>`).join('')}</div><div id="wave-pay-note" class="wave-pay-note"></div></div><div id="checkout-error" class="checkout-error" style="display:none"></div></div><button class="btn btn-primary btn-block" style="margin-top:16px" id="checkout-submit" onclick="ubSubmitOrder()">Passer la commande</button><p style="font-size:.7rem;color:var(--ink-soft);text-align:center;margin-top:12px">Paiement sécurisé · Commande préparée avec soin</p></div></div>`;
  ubTogglePaymentNote();
  ubRecalcSummary();
}

function ubUpdateLine(id,qty){ if(qty<=0) ubRemoveFromCart(id); else ubSetQty(id,qty); renderCart(); }

function ubOpenNoteModal(productId){
  const line = currentLines.find(l=>l.product.id===productId && !l.boxInstanceId);
  if(!line) return;
  const product = line.product;
  const overlay = document.getElementById('note-overlay'), body = document.getElementById('note-modal-body');
  let photoPath = line.clientPhotoPath || null;
  overlay.classList.add('open');
  overlay.onclick = e=>{ if(e.target===overlay) overlay.classList.remove('open') };

  function render(){
    body.innerHTML = `<button class="note-close" onclick="document.getElementById('note-overlay').classList.remove('open')">${ubIcon('close')}</button>
      <h3>${product.name}</h3>
      <p style="color:var(--ink-soft);font-size:.85rem;margin:4px 0 0">${product.clientNotePrompt || "Merci de préciser ce dont vous avez besoin pour ce produit."}</p>
      <textarea id="note-text" rows="3" placeholder="Votre précision (optionnel si vous joignez une photo)">${line.clientNote || ''}</textarea>
      <label class="note-photo-zone" for="note-photo-input" id="note-photo-zone">
        ${photoPath ? `${ubIcon('check')} Photo jointe — touchez pour la remplacer` : `${ubIcon('camera')}<br>Joindre une photo (optionnel si vous précisez par texte)`}
      </label>
      <input type="file" id="note-photo-input" accept="image/*" hidden>
      <div style="display:flex;gap:10px;justify-content:flex-end;margin-top:16px">
        <button class="btn" type="button" onclick="document.getElementById('note-overlay').classList.remove('open')">Annuler</button>
        <button class="btn btn-primary" type="button" id="note-save">Enregistrer</button>
      </div>`;
    document.getElementById('note-photo-input').addEventListener('change', async e=>{
      const file = e.target.files[0];
      if(!file) return;
      const zone = document.getElementById('note-photo-zone');
      zone.innerHTML = 'Envoi de la photo...';
      const path = await ubUploadClientPhoto(file);
      if(!path){ ubShowToast("Échec de l'envoi de la photo, réessayez"); zone.innerHTML = `${ubIcon('camera')}<br>Joindre une photo (optionnel si vous précisez par texte)`; return; }
      photoPath = path;
      zone.innerHTML = `${ubIcon('check')} Photo jointe — touchez pour la remplacer`;
    });
    document.getElementById('note-save').addEventListener('click', ()=>{
      const note = document.getElementById('note-text').value.trim();
      if(!note && !photoPath){ ubShowToast('Merci de préciser par texte ou de joindre une photo.'); return; }
      ubSetCartLineNote(productId, note, photoPath);
      overlay.classList.remove('open');
      renderCart();
    });
  }
  render();
}

async function ubSubmitOrder(){
  const btn=document.getElementById('checkout-submit'), errBox=document.getElementById('checkout-error');
  errBox.style.display='none';
  const name=document.getElementById('co-name').value.trim();
  const phone=document.getElementById('co-phone').value.trim();
  const addressDetail=document.getElementById('co-address').value.trim();
  const zoneId=document.getElementById('co-zone')?.value;
  const zone=currentZones.find(z=>String(z.id)===zoneId) || currentZones[0];
  const address=zone ? (addressDetail ? `${zone.name}, ${addressDetail}` : zone.name) : addressDetail;
  const payment=document.querySelector('input[name="payment"]:checked')?.value || UB_PAYMENT_METHODS[0];

  const showError = (msg) => { errBox.textContent=msg; errBox.style.display='block'; };
  if(!currentLines.length) return showError('Votre panier est vide.');
  const missingNote = currentLines.find(l=>!l.boxInstanceId && l.product.requiresClientNote && !(l.clientNote || l.clientPhotoPath));
  if(missingNote) return showError(`Merci de renseigner l'info demandée pour "${missingNote.product.name}" (bouton sur la ligne du produit) avant de valider votre commande.`);
  if(!name) return showError('Merci de renseigner votre nom complet.');
  if(!phone || phone.replace(/\D/g,'').length < 9) return showError('Merci de renseigner un numéro de téléphone valide.');
  if(!zone) return showError('Merci de choisir votre zone de livraison.');
  if(!wavePaymentProofPath){
    const depositNow = ubDepositAmount();
    return showError(payment==='Paiement à la livraison'
      ? `Merci de joindre la capture d'écran de la transaction Wave prouvant le paiement de l'acompte de ${ubFormatPrice(depositNow)} : sans cette preuve, la commande ne peut pas être validée.`
      : "Merci de joindre la capture d'écran de la transaction Wave prouvant votre paiement : sans cette preuve, la commande ne peut pas être validée.");
  }

  btn.disabled=true; btn.textContent='Traitement en cours...';
  const result = await ubPlaceOrder({
    clientName: name, phone, address, paymentMethod: payment,
    items: currentLines.map(l => ({ id: l.product.id, qty: l.qty, boxInstanceId: l.boxInstanceId, boxTemplateId: l.boxTemplateId, clientNote: l.clientNote, clientPhotoPath: l.clientPhotoPath })),
    promoCode: appliedPromo ? appliedPromo.code : null,
    deliveryZoneId: zone.id,
    paymentProofPath: wavePaymentProofPath,
  });
  btn.disabled=false; btn.textContent='Passer la commande';

  if(result.error){
    if(result.error==='PRODUIT_INDISPONIBLE'){
      const p=currentLines.find(l=>l.product.id===result.productId)?.product;
      showError(`Stock insuffisant pour "${p?p.name:result.productId}" : ajustez la quantité ou retirez ce produit du panier.`);
    } else if(result.error==='PANIER_VIDE'){
      showError('Votre panier est vide.');
    } else if(result.error==='NOM_CLIENT_REQUIS'){
      showError('Merci de renseigner votre nom complet.');
    } else if(result.error==='TELEPHONE_REQUIS'){
      showError('Merci de renseigner votre numéro de téléphone.');
    } else if(result.error==='BOX_INVALIDE'){
      showError("Une box cadeau de votre panier n'est plus disponible ou a été modifiée entre-temps. Merci de retirer la box et de la recomposer.");
    } else if(result.error==='PREUVE_PAIEMENT_REQUISE'){
      showError("Merci de joindre la capture d'écran de la transaction Wave : sans cette preuve, la commande ne peut pas être validée.");
    } else {
      showError("Une erreur est survenue lors de l'enregistrement de votre commande. Merci de réessayer dans un instant.");
    }
    return;
  }

  const finalTotal=ubCurrentTotal();
  const depositPaid=ubDepositAmount(finalTotal);
  const remainderDue=finalTotal-depositPaid;
  const orderedLines=currentLines;
  ubSaveCart([]);
  appliedPromo=null;
  wavePaymentProofPath=null;
  const balanceNote = payment==='Paiement à la livraison'
    ? ` Acompte de <strong>${ubFormatPrice(depositPaid)}</strong> réglé via Wave — solde de <strong>${ubFormatPrice(remainderDue)}</strong> à régler à la livraison.`
    : ` Montant total de <strong>${ubFormatPrice(finalTotal)}</strong> réglé via Wave.`;

  if(zone.whatsappHandoff){
    const itemsList = orderedLines.map(l=>`- ${l.product.name} x${l.qty}`).join('\n');
    const waText = `Nouvelle commande ${result.orderId} — ${zone.name}\n`
      + `Client : ${name}\n`
      + `Téléphone : ${phone}\n`
      + `Point de RDV / adresse : ${addressDetail || 'non précisé, à demander au client'}\n\n`
      + `Articles :\n${itemsList}\n\n`
      + `Montant total : ${ubFormatPrice(finalTotal)}\n`
      + (payment==='Paiement à la livraison' ? `Acompte déjà réglé via Wave : ${ubFormatPrice(depositPaid)}\nSolde à récupérer à la livraison : ${ubFormatPrice(remainderDue)}` : `Montant déjà réglé via Wave : ${ubFormatPrice(finalTotal)}`);
    const waLink = `https://wa.me/${UB_CONTACT.whatsapp}?text=${encodeURIComponent(waText)}`;
    document.getElementById('cart-content').innerHTML=`<div class="empty-cart">${ubIcon('check')}<h3>Commande confirmée !</h3><p style="color:var(--ink-soft)">Merci ${name.split(' ')[0]}, votre commande <strong>${result.orderId}</strong> a bien été enregistrée.${balanceNote}</p><p style="color:var(--ink-soft)">Ce mode de livraison (${zone.name}) est coordonné directement sur WhatsApp : continuez pour nous envoyer le récapitulatif et organiser la remise.</p><a href="${waLink}" target="_blank" rel="noopener" class="btn btn-primary" style="background:#25D366;border-color:#25D366">${ubIcon('whatsapp')} Continuer sur WhatsApp</a><br><a href="boutique.html" style="display:inline-block;margin-top:14px;font-size:.82rem;color:var(--mauve-600)">Continuer mes achats</a></div>`;
    window.open(waLink, '_blank');
    return;
  }

  document.getElementById('cart-content').innerHTML=`<div class="empty-cart">${ubIcon('check')}<h3>Commande confirmée !</h3><p style="color:var(--ink-soft)">Merci ${name.split(' ')[0]}, votre commande <strong>${result.orderId}</strong> a bien été enregistrée.${balanceNote} Nous vous contacterons au ${phone} pour la confirmer.</p><a href="boutique.html" class="btn btn-primary">Continuer mes achats</a></div>`;
}

renderCart();
</script></body></html>
