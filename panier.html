<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Panier — Urbann Beauty</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

<div id="site-header"></div>

<div class="breadcrumb">
  <div class="container"><a href="index.html">Accueil</a><span>/</span><span>Panier</span></div>
</div>

<section style="padding-top:48px">
  <div class="container">
    <div class="section-head" style="text-align:left;margin-bottom:36px">
      <span class="eyebrow">Votre sélection</span>
      <h2>Mon panier</h2>
    </div>
    <div id="cart-content"></div>
  </div>
</section>

<div id="site-footer"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="assets/js/icons.js"></script>
<script src="assets/js/data.js"></script>
<script src="assets/js/media.js"></script>
<script src="assets/js/main.js"></script>
<script>
  ubRenderHeader('boutique');
  ubRenderFooter();

  async function renderCart() {
    const cart = ubGetCart();
    const container = document.getElementById('cart-content');

    if (!cart.length) {
      container.innerHTML = `
        <div class="empty-cart">
          ${ubIcon('bag')}
          <h3>Votre panier est vide</h3>
          <p style="color:var(--ink-soft)">Parcourez la boutique et ajoutez vos produits favoris.</p>
          <a href="boutique.html" class="btn btn-primary">Découvrir la boutique</a>
        </div>`;
      return;
    }

    const [allProducts, allCategories] = await Promise.all([ubGetAllProducts(), ubGetAllCategories()]);
    const productsById = Object.fromEntries(allProducts.map(p => [p.id, p]));
    const catsById = ubCatsById(allCategories);
    const lines = cart.map(l => ({ ...l, product: productsById[l.id] })).filter(l => l.product);
    const subtotal = lines.reduce((s, l) => s + l.product.price * l.qty, 0);
    const shipping = subtotal >= 50000 ? 0 : 2500;
    const total = subtotal + shipping;

    container.innerHTML = `
      <div class="cart-layout">
        <div class="cart-table-wrap">
          <table class="cart-table">
            <thead>
              <tr><th>Produit</th><th>Prix</th><th>Quantité</th><th>Total</th><th></th></tr>
            </thead>
            <tbody>
              ${lines.map(l => `
                <tr>
                  <td>
                    <a href="produit.html?id=${l.product.id}" class="cart-product">
                      <img src="${l.product.img}" alt="${l.product.name}">
                      <div><strong>${l.product.name}</strong><span>${catsById[l.product.category]?.name || ''}</span></div>
                    </a>
                  </td>
                  <td>${ubFormatPrice(l.product.price)}</td>
                  <td>
                    <div class="qty-selector">
                      <button onclick="ubUpdateLine('${l.product.id}', ${l.qty - 1})">−</button>
                      <span>${l.qty}</span>
                      <button onclick="ubUpdateLine('${l.product.id}', ${l.qty + 1})">+</button>
                    </div>
                  </td>
                  <td><strong>${ubFormatPrice(l.product.price * l.qty)}</strong></td>
                  <td><button class="remove-btn" onclick="ubRemoveFromCart('${l.product.id}'); renderCart();">${ubIcon('trash')}</button></td>
                </tr>`).join('')}
            </tbody>
          </table>
        </div>
        <div class="cart-summary">
          <h3 style="margin-bottom:20px">Récapitulatif</h3>
          <div class="summary-row"><span>Sous-total</span><span>${ubFormatPrice(subtotal)}</span></div>
          <div class="summary-row"><span>Livraison</span><span>${shipping === 0 ? 'Offerte' : ubFormatPrice(shipping)}</span></div>
          <div class="coupon-row">
            <input type="text" placeholder="Code promo">
            <button class="btn btn-outline btn-sm" onclick="ubShowToast('Code promo appliqué')">Appliquer</button>
          </div>
          <div class="summary-row total"><span>Total</span><span>${ubFormatPrice(total)}</span></div>
          <button class="btn btn-primary btn-block" style="margin-top:20px" onclick="ubShowToast('Redirection vers le paiement...')">Passer la commande</button>
          <a href="boutique.html" style="display:block;text-align:center;margin-top:16px;font-size:.85rem;color:var(--mauve-600)">← Continuer mes achats</a>
        </div>
      </div>`;
  }

  function ubUpdateLine(id, qty) {
    if (qty <= 0) { ubRemoveFromCart(id); } else { ubSetQty(id, qty); }
    renderCart();
  }

  renderCart();
</script>
</body>
</html>
