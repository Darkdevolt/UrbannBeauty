<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Livraisons — Admin Urbann Beauty</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/admin.css">
<style>
.op-toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.op-toolbar input,.op-toolbar select,.op-form input,.op-form select,.op-form textarea{border:1px solid var(--a-line);border-radius:10px;padding:10px 12px;background:#fff;color:var(--a-ink);font:inherit}.op-toolbar input{min-width:260px}.op-phone{font-weight:600;white-space:nowrap}.op-meta{font-size:.76rem;color:var(--a-ink-soft);margin-top:3px}.op-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.op-form{display:grid;grid-template-columns:1fr 1fr;gap:12px}.op-form .full{grid-column:1/-1}.op-form label{font-size:.75rem;font-weight:600;color:var(--a-ink-soft);display:flex;flex-direction:column;gap:6px}.op-empty{padding:30px;text-align:center;color:var(--a-ink-soft)}
@media(max-width:800px){.op-grid,.op-form{grid-template-columns:1fr}.op-form .full{grid-column:auto}}
</style>
</head>
<body><div class="admin-shell" id="admin-shell"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="../assets/js/icons.js"></script><script src="../assets/js/data.js"></script><script src="../assets/js/media.js"></script><script src="assets/admin.js"></script>
<script>
const DELIVERY_STATUSES={a_preparer:'À préparer',prete:'Prête',en_livraison:'En livraison',livree:'Livrée',echec:'Échec de livraison',annulee:'Annulée'};
const esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
async function getDeliveryOrders(){const {data,error}=await ubSupabase.from('orders').select('*, order_items(product_id,qty)').order('created_at',{ascending:false});if(error){console.error(error);return []}return data||[]}
async function saveDelivery(id,patch){const {error}=await ubSupabase.from('orders').update(patch).eq('id',id);if(error){alert(error.message);return false}return true}
function addOpsNav(){const nav=document.querySelector('.a-nav');if(!nav)return;nav.insertAdjacentHTML('beforeend',`<div class="group-label">Logistique</div><a href="livraison.html" class="active">${ubIcon('truck')} Livraisons</a><a href="zones.html">${ubIcon('filter')} Zones de livraison</a><a href="retours.html">${ubIcon('refresh')} Retours</a>`)}
async function main(){if(!(await ubAdminGuard()))return;await ubAdminRenderShell('livraison','Livraisons','Suivi des commandes et gestion des livraisons par numéro de téléphone');addOpsNav();
const orders=await getDeliveryOrders();let products=await ubGetAllProducts();let productMap=Object.fromEntries(products.map(p=>[p.id,p]));
const render=()=>{const q=(document.getElementById('search').value||'').trim().toLowerCase();const status=document.getElementById('status').value;const list=orders.filter(o=>(!q||[o.id,o.client_name,o.phone,o.address].join(' ').toLowerCase().includes(q))&&(!status||o.delivery_status===status));document.getElementById('count').textContent=`${list.length} livraison${list.length>1?'s':''}`;document.getElementById('tbody').innerHTML=list.map(o=>`<tr><td><strong>${esc(o.id)}</strong><div class="op-meta">${esc(o.order_date||'')}</div></td><td><strong>${esc(o.client_name)}</strong><div class="op-phone">${esc(o.phone||'—')}</div><div class="op-meta">${esc(o.address||'Adresse non renseignée')}</div></td><td>${(o.order_items||[]).map(i=>`${esc(productMap[i.product_id]?.name||'Produit')} × ${i.qty}`).join('<br>')}</td><td><select data-id="${esc(o.id)}" class="delivery-status">${Object.entries(DELIVERY_STATUSES).map(([k,v])=>`<option value="${k}" ${o.delivery_status===k?'selected':''}>${v}</option>`).join('')}</select></td><td><div>${esc(o.delivery_person||'Non attribué')}</div><div class="op-meta">${esc(o.delivery_date||'')}</div></td><td><button class="a-btn a-btn-outline a-btn-sm" onclick="editDelivery('${esc(o.id)}')">Gérer</button></td></tr>`).join('')||`<tr><td colspan="6" class="op-empty">Aucune livraison trouvée.</td></tr>`;
document.querySelectorAll('.delivery-status').forEach(s=>s.onchange=async()=>{const id=s.dataset.id;const patch={delivery_status:s.value};if(s.value==='livree')patch.delivered_at=new Date().toISOString();if(await saveDelivery(id,patch)){const o=orders.find(x=>x.id===id);Object.assign(o,patch);ubAToast('Statut de livraison mis à jour');render()}})};
window.editDelivery=async id=>{const o=orders.find(x=>x.id===id);if(!o)return;document.getElementById('edit-title').textContent=`Commande ${o.id}`;document.getElementById('edit-phone').textContent=o.phone||'Téléphone non renseigné';document.getElementById('edit-client').textContent=`${o.client_name||''} — ${o.address||'Adresse non renseignée'}`;document.getElementById('edit-person').value=o.delivery_person||'';document.getElementById('edit-date').value=o.delivery_date||'';document.getElementById('edit-status').value=o.delivery_status||'a_preparer';document.getElementById('edit-notes').value=o.delivery_notes||'';document.getElementById('edit').dataset.id=id;document.getElementById('edit').style.display='block'};
document.getElementById('a-content').innerHTML=`<div class="a-panel" style="margin-bottom:18px"><div class="a-panel-body"><div class="op-toolbar"><input id="search" placeholder="Rechercher par téléphone, client ou commande"><select id="status"><option value="">Tous les statuts</option>${Object.entries(DELIVERY_STATUSES).map(([k,v])=>`<option value="${k}">${v}</option>`).join('')}</select><span id="count" class="a-badge neutral"></span></div></div></div><div class="a-panel" id="edit" style="display:none;margin-bottom:18px"><div class="a-panel-head"><div><h3 id="edit-title">Gestion</h3><div id="edit-client" class="op-meta"></div><div id="edit-phone" class="op-phone"></div></div><button class="a-btn a-btn-outline a-btn-sm" onclick="document.getElementById('edit').style.display='none'">Fermer</button></div><div class="a-panel-body"><div class="op-form"><label>Statut<select id="edit-status">${Object.entries(DELIVERY_STATUSES).map(([k,v])=>`<option value="${k}">${v}</option>`).join('')}</select></label><label>Livreur / responsable<input id="edit-person" placeholder="Nom du livreur"></label><label>Date prévue<input type="date" id="edit-date"></label><label class="full">Notes<textarea id="edit-notes" rows="3" placeholder="Instructions, appel client, problème..."></textarea></label><div class="full"><button class="a-btn a-btn-primary" id="save-edit">Enregistrer la livraison</button></div></div></div></div><div class="a-panel"><div class="a-panel-head"><div><h3>Suivi des livraisons</h3><div class="op-meta">Le numéro de téléphone permet de retrouver rapidement le client et son historique.</div></div></div><div class="a-table-wrap"><table class="a-table"><thead><tr><th>Commande</th><th>Client / Téléphone</th><th>Articles</th><th>Statut</th><th>Livraison</th><th></th></tr></thead><tbody id="tbody"></tbody></table></div></div>`;
document.getElementById('search').oninput=render;document.getElementById('status').onchange=render;document.getElementById('save-edit').onclick=async()=>{const box=document.getElementById('edit'),id=box.dataset.id;const status=document.getElementById('edit-status').value;const patch={delivery_status:status,delivery_person:document.getElementById('edit-person').value.trim()||null,delivery_date:document.getElementById('edit-date').value||null,delivery_notes:document.getElementById('edit-notes').value.trim()||null};if(status==='livree')patch.delivered_at=new Date().toISOString();if(await saveDelivery(id,patch)){Object.assign(orders.find(x=>x.id===id),patch);box.style.display='none';ubAToast('Livraison enregistrée');render()}};render()}
main();
</script></body></html>
