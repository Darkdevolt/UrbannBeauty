<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Livraisons — Admin Urbann Beauty</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/admin.css">
<style>
.op-toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.op-toolbar input,.op-toolbar select,.op-form input,.op-form select,.op-form textarea{border:1px solid var(--a-line);border-radius:10px;padding:10px 12px;background:#fff;color:var(--a-ink);font:inherit}.op-toolbar input{min-width:260px}.op-phone{font-weight:600;white-space:nowrap}.op-meta{font-size:.76rem;color:var(--a-ink-soft);margin-top:3px}.op-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.op-form{display:grid;grid-template-columns:1fr 1fr;gap:12px}.op-form .full{grid-column:1/-1}.op-form label{font-size:.75rem;font-weight:600;color:var(--a-ink-soft);display:flex;flex-direction:column;gap:6px}.op-empty{padding:30px;text-align:center;color:var(--a-ink-soft)}
.queue-row{display:flex;align-items:center;gap:12px;padding:12px 14px;border:1px solid var(--a-line);border-radius:12px;margin-bottom:8px;background:#fff}
.queue-rank{width:28px;height:28px;border-radius:50%;background:var(--a-mauve-light);color:var(--a-mauve);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:.8rem;flex-shrink:0}
.queue-info{flex:1;min-width:0}
.queue-info strong{display:block;font-size:.86rem}
.queue-actions{display:flex;gap:6px;align-items:center;flex-shrink:0}
.queue-move{width:32px;height:32px;border:1px solid var(--a-line);background:#fff;border-radius:8px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.queue-move:disabled{opacity:.3;cursor:not-allowed}
.wa-btn{color:#25D366}
@media(max-width:800px){.op-grid,.op-form{grid-template-columns:1fr}.op-form .full{grid-column:auto}}
</style>
</head>
<body><div class="admin-shell" id="admin-shell"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="../assets/js/icons.js"></script><script src="../assets/js/data.js"></script><script src="../assets/js/media.js"></script><script src="assets/admin.js"></script>
<script>
const DELIVERY_STATUSES={a_preparer:'À préparer',prete:'Prête',en_livraison:'En livraison',livree:'Livrée',echec:'Échec de livraison',annulee:'Annulée'};
const esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
async function getDeliveryOrders(){const {data,error}=await ubSupabase.from('orders').select('*, order_items(product_id,qty,client_note,client_photo_path)').order('created_at',{ascending:false});if(error){console.error(error);return []}return data||[]}
function hasClientInfo(o){return (o.order_items||[]).some(i=>i.client_note||i.client_photo_path)}
async function saveDelivery(id,patch){const {error}=await ubSupabase.from('orders').update(patch).eq('id',id);if(error){alert(error.message);return false}return true}
function addOpsNav(){const nav=document.querySelector('.a-nav');if(!nav)return;nav.insertAdjacentHTML('beforeend',`<div class="group-label">Logistique</div><a href="livraison.html" class="active">${ubIcon('truck')} Livraisons</a><a href="zones.html">${ubIcon('filter')} Zones de livraison</a><a href="retours.html">${ubIcon('refresh')} Retours</a>`)}
async function main(){if(!(await ubAdminGuard()))return;await ubAdminRenderShell('livraison','Livraisons','Suivi des commandes et gestion des livraisons par numéro de téléphone');addOpsNav();
const orders=await getDeliveryOrders();let products=await ubGetAllProducts();let productMap=Object.fromEntries(products.map(p=>[p.id,p]));
const render=()=>{const q=(document.getElementById('search').value||'').trim().toLowerCase();const status=document.getElementById('status').value;const list=orders.filter(o=>(!q||[o.id,o.client_name,o.phone,o.address].join(' ').toLowerCase().includes(q))&&(!status||o.delivery_status===status));document.getElementById('count').textContent=`${list.length} livraison${list.length>1?'s':''}`;document.getElementById('tbody').innerHTML=list.map(o=>`<tr><td><strong>${esc(o.id)}</strong><div class="op-meta">${esc(o.order_date||'')}</div></td><td><strong>${esc(o.client_name)}</strong><div class="op-phone">${esc(o.phone||'—')}</div><div class="op-meta">${esc(o.address||'Adresse non renseignée')}</div></td><td>${(o.order_items||[]).map(i=>`${esc(productMap[i.product_id]?.name||'Produit')} × ${i.qty}`).join('<br>')}${hasClientInfo(o)?` <a href="bon-commande.html?id=${esc(o.id)}" target="_blank" style="color:var(--a-mauve)" title="Info fournie par la cliente — voir le bon de commande">${ubIcon('camera')}</a>`:''}</td><td><select data-id="${esc(o.id)}" class="delivery-status">${Object.entries(DELIVERY_STATUSES).map(([k,v])=>`<option value="${k}" ${o.delivery_status===k?'selected':''}>${v}</option>`).join('')}</select></td><td><div>${esc(o.delivery_person||'Non attribué')}</div><div class="op-meta">${esc(o.delivery_date||'')}</div></td><td><div class="a-actions-cell"><a class="a-icon-action wa-btn" href="${ubWhatsAppOrderUpdateLink({id:o.id,client:o.client_name,phone:o.phone},UB_DELIVERY_STATUS_MSG[o.delivery_status])}" target="_blank" rel="noopener" title="Envoyer la mise à jour sur WhatsApp">${ubIcon('whatsapp')}</a><button class="a-btn a-btn-outline a-btn-sm" onclick="editDelivery('${esc(o.id)}')">Gérer</button></div></td></tr>`).join('')||`<tr><td colspan="6" class="op-empty">Aucune livraison trouvée.</td></tr>`;
document.querySelectorAll('.delivery-status').forEach(s=>s.onchange=async()=>{const id=s.dataset.id;const patch={delivery_status:s.value};if(s.value==='livree')patch.delivered_at=new Date().toISOString();if(await saveDelivery(id,patch)){const o=orders.find(x=>x.id===id);Object.assign(o,patch);ubAToast('Statut de livraison mis à jour');render();renderQueue()}})};
const renderQueue=()=>{const queue=orders.filter(o=>o.status!=='annulee'&&o.delivery_status!=='livree').sort((a,b)=>(a.queue_position||0)-(b.queue_position||0));document.getElementById('queue-count').textContent=`${queue.length} commande${queue.length>1?'s':''} en attente`;document.getElementById('queue-list').innerHTML=queue.length?queue.map((o,i)=>`<div class="queue-row"><div class="queue-rank">${i+1}</div><div class="queue-info"><strong>${esc(o.client_name)}</strong><div class="op-meta">${esc(o.id)} · ${esc(o.phone||'—')} · ${DELIVERY_STATUSES[o.delivery_status]||o.delivery_status}${hasClientInfo(o)?` · <a href="bon-commande.html?id=${esc(o.id)}" target="_blank" style="color:var(--a-mauve)">${ubIcon('camera')} info cliente</a>`:''}</div></div><div class="queue-actions"><button class="queue-move" title="Monter" ${i===0?'disabled':''} onclick="ubQueueMove('${esc(o.id)}',-1)">${ubIcon('chevronUp')||'↑'}</button><button class="queue-move" title="Descendre" ${i===queue.length-1?'disabled':''} onclick="ubQueueMove('${esc(o.id)}',1)">${ubIcon('chevronDown')||'↓'}</button><a class="a-icon-action wa-btn" href="${ubWhatsAppOrderUpdateLink({id:o.id,client:o.client_name,phone:o.phone},UB_DELIVERY_STATUS_MSG[o.delivery_status])}" target="_blank" rel="noopener" title="Envoyer la mise à jour sur WhatsApp">${ubIcon('whatsapp')}</a></div></div>`).join(''):`<div class="op-empty">Aucune commande en attente de traitement.</div>`};
window.ubQueueMove=async(id,dir)=>{const queue=orders.filter(o=>o.status!=='annulee'&&o.delivery_status!=='livree').sort((a,b)=>(a.queue_position||0)-(b.queue_position||0));const idx=queue.findIndex(o=>o.id===id);const swapIdx=idx+dir;if(idx<0||swapIdx<0||swapIdx>=queue.length)return;const a=queue[idx],b=queue[swapIdx];const posA=a.queue_position,posB=b.queue_position;if(await ubAdminSwapQueuePosition(a.id,posA,b.id,posB)){a.queue_position=posB;b.queue_position=posA;renderQueue()}else{ubAToast('Erreur lors du réordonnancement')}};
window.editDelivery=async id=>{const o=orders.find(x=>x.id===id);if(!o)return;document.getElementById('edit-title').textContent=`Commande ${o.id}`;document.getElementById('edit-phone').textContent=o.phone||'Téléphone non renseigné';document.getElementById('edit-client').textContent=`${o.client_name||''} — ${o.address||'Adresse non renseignée'}`;document.getElementById('edit-person').value=o.delivery_person||'';document.getElementById('edit-date').value=o.delivery_date||'';document.getElementById('edit-status').value=o.delivery_status||'a_preparer';document.getElementById('edit-notes').value=o.delivery_notes||'';document.getElementById('edit').dataset.id=id;document.getElementById('edit').style.display='block'};
document.getElementById('a-content').innerHTML=`<div class="a-panel" style="margin-bottom:18px"><div class="a-panel-body"><div class="op-toolbar"><input id="search" placeholder="Rechercher par téléphone, client ou commande"><select id="status"><option value="">Tous les statuts</option>${Object.entries(DELIVERY_STATUSES).map(([k,v])=>`<option value="${k}">${v}</option>`).join('')}</select><span id="count" class="a-badge neutral"></span></div></div></div><div class="a-panel" style="margin-bottom:18px;padding:20px"><div class="a-panel-head" style="padding:0 0 14px"><div><h3 style="margin:0">File d'attente de traitement</h3><div class="op-meta">Ordre dans lequel préparer/livrer les commandes en cours. Réorganisez avec les flèches.</div></div><span id="queue-count" class="a-badge neutral"></span></div><div id="queue-list"></div></div><div class="a-panel" id="edit" style="display:none;margin-bottom:18px"><div class="a-panel-head"><div><h3 id="edit-title">Gestion</h3><div id="edit-client" class="op-meta"></div><div id="edit-phone" class="op-phone"></div></div><button class="a-btn a-btn-outline a-btn-sm" onclick="document.getElementById('edit').style.display='none'">Fermer</button></div><div class="a-panel-body"><div class="op-form"><label>Statut<select id="edit-status">${Object.entries(DELIVERY_STATUSES).map(([k,v])=>`<option value="${k}">${v}</option>`).join('')}</select></label><label>Livreur / responsable<input id="edit-person" placeholder="Nom du livreur"></label><label>Date prévue<input type="date" id="edit-date"></label><label class="full">Notes<textarea id="edit-notes" rows="3" placeholder="Instructions, appel client, problème..."></textarea></label><div class="full"><button class="a-btn a-btn-primary" id="save-edit">Enregistrer la livraison</button></div></div></div></div><div class="a-panel"><div class="a-panel-head"><div><h3>Suivi des livraisons</h3><div class="op-meta">Le numéro de téléphone permet de retrouver rapidement le client et son historique.</div></div></div><div class="a-table-wrap"><table class="a-table"><thead><tr><th>Commande</th><th>Client / Téléphone</th><th>Articles</th><th>Statut</th><th>Livraison</th><th></th></tr></thead><tbody id="tbody"></tbody></table></div></div>`;
document.getElementById('search').oninput=render;document.getElementById('status').onchange=render;document.getElementById('save-edit').onclick=async()=>{const box=document.getElementById('edit'),id=box.dataset.id;const status=document.getElementById('edit-status').value;const patch={delivery_status:status,delivery_person:document.getElementById('edit-person').value.trim()||null,delivery_date:document.getElementById('edit-date').value||null,delivery_notes:document.getElementById('edit-notes').value.trim()||null};if(status==='livree')patch.delivered_at=new Date().toISOString();if(await saveDelivery(id,patch)){Object.assign(orders.find(x=>x.id===id),patch);box.style.display='none';ubAToast('Livraison enregistrée');render();renderQueue()}};render();renderQueue()}
main();
</script></body></html>
