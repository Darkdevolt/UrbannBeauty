<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Produits & Stock — Admin Urbann Beauty</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/admin.css">
</head>
<body>

<div class="admin-shell" id="admin-shell"></div>

<!-- Modal Ajout / Édition produit -->
<div class="a-modal-overlay" id="product-modal">
  <div class="a-modal">
    <div class="a-modal-head">
      <h3 id="modal-title">Ajouter un produit</h3>
      <button class="a-modal-close" onclick="ubCloseModal()">{{close}}</button>
    </div>
    <div class="a-modal-body">
      <form id="product-form">
        <input type="hidden" id="f-id">
        <div class="a-form-grid">
          <div class="a-field full">
            <label>Nom du produit</label>
            <input type="text" id="f-name" required placeholder="Ex : Sérum Éclat Vitamine C">
          </div>
          <div class="a-field">
            <label>Catégorie</label>
            <select id="f-category" required></select>
          </div>
          <div class="a-field">
            <label>Prix de vente (FCFA)</label>
            <input type="number" id="f-price" required min="0" placeholder="24000">
          </div>
          <div class="a-field">
            <label>Prix barré (optionnel)</label>
            <input type="number" id="f-oldprice" min="0" placeholder="29000">
          </div>
          <div class="a-field">
            <label>Quantité en stock</label>
            <input type="number" id="f-stock" required min="0" placeholder="42">
          </div>
          <div class="a-field full">
            <label>Description</label>
            <textarea id="f-desc" rows="4" required placeholder="Décrivez le produit, ses bénéfices, son utilisation..."></textarea>
          </div>
          <div class="a-field full">
            <label>Photo du produit</label>
            <div class="upload-zone" onclick="document.getElementById('f-photo-input').click()">
              {{upload}}
              <p><strong>Cliquez pour importer</strong> ou glissez une image ici (JPG, PNG)</p>
            </div>
            <input type="file" id="f-photo-input" accept="image/*" hidden>
            <div class="upload-preview" id="photo-preview"></div>
          </div>
          <div class="a-field full">
            <label>Vidéo de présentation (optionnel)</label>
            <div class="upload-zone" onclick="document.getElementById('f-video-input').click()">
              {{video}}
              <p><strong>Cliquez pour importer</strong> une courte vidéo produit (MP4)</p>
            </div>
            <input type="file" id="f-video-input" accept="video/*" hidden>
            <div class="upload-preview" id="video-preview"></div>
          </div>
        </div>
      </form>
    </div>
    <div class="a-modal-foot">
      <button class="a-btn a-btn-outline" onclick="ubCloseModal()">Annuler</button>
      <button class="a-btn a-btn-primary" onclick="ubSaveProduct()">Enregistrer le produit</button>
    </div>
  </div>
</div>

<script src="../assets/js/icons.js"></script>
<script src="../assets/js/data.js"></script>
<script src="assets/admin.js"></script>
<script>
  ubAdminGuard();
  ubAdminRenderShell('produits', 'Produits & Stock', 'Ajoutez, modifiez et suivez le stock de vos produits');

  document.querySelectorAll('.a-modal-close, .upload-zone').forEach(() => {});
  document.querySelector('.a-modal-head').innerHTML = document.querySelector('.a-modal-head').innerHTML.replace('{{close}}', ubIcon('close'));
  document.querySelectorAll('.upload-zone').forEach(z => {
    const m = z.innerHTML.match(/\{\{(\w+)\}\}/);
    if (m) z.innerHTML = z.innerHTML.replace(m[0], ubIcon(m[1]));
  });

  let products = ubAdminGetProducts();
  let currentPhoto = null;
  let currentVideo = null;
  let filterState = { q: '', cat: 'all', stock: 'all' };

  function renderContent() {
    document.getElementById('a-content').innerHTML = `
      <div class="a-toolbar">
        <div class="a-search">${ubIcon('search')}<input type="text" id="search-input" placeholder="Rechercher un produit..." value="${filterState.q}"></div>
        <div class="a-filters">
          <select class="a-select" id="filter-cat"></select>
          <select class="a-select" id="filter-stock">
            <option value="all">Tous les stocks</option>
            <option value="low">Stock faible (≤ 5)</option>
            <option value="ok">En stock</option>
          </select>
          <button class="a-btn a-btn-primary" onclick="ubOpenModal()">${ubIcon('plus')} Ajouter un produit</button>
        </div>
      </div>
      <div class="a-panel">
        <div class="a-table-wrap">
          <table class="a-table">
            <thead>
              <tr><th>Produit</th><th>Catégorie</th><th>Prix</th><th>Stock</th><th>Statut</th><th>Actions</th></tr>
            </thead>
            <tbody id="products-tbody"></tbody>
          </table>
        </div>
      </div>
    `;

    document.getElementById('filter-cat').innerHTML = `<option value="all">Toutes les catégories</option>` +
      UB_CATEGORIES.map(c => `<option value="${c.id}" ${filterState.cat === c.id ? 'selected' : ''}>${c.name}</option>`).join('');
    document.getElementById('filter-cat').value = filterState.cat;
    document.getElementById('filter-stock').value = filterState.stock;

    document.getElementById('search-input').addEventListener('input', e => { filterState.q = e.target.value.toLowerCase(); renderTable(); });
    document.getElementById('filter-cat').addEventListener('change', e => { filterState.cat = e.target.value; renderTable(); });
    document.getElementById('filter-stock').addEventListener('change', e => { filterState.stock = e.target.value; renderTable(); });

    renderTable();
  }

  function renderTable() {
    let list = products.filter(p =>
      p.name.toLowerCase().includes(filterState.q) &&
      (filterState.cat === 'all' || p.category === filterState.cat) &&
      (filterState.stock === 'all' || (filterState.stock === 'low' ? p.stock <= 5 : p.stock > 5))
    );
    document.getElementById('products-tbody').innerHTML = list.length ? list.map(p => `
      <tr>
        <td>
          <div class="a-prod-cell">
            <img src="${p.img}" alt="">
            <div><strong>${p.name}</strong><span>Réf. UB-${p.id.toUpperCase()}</span></div>
          </div>
        </td>
        <td>${ubGetCategory(p.category)?.name || '—'}</td>
        <td><strong>${ubFormatPrice(p.price)}</strong>${p.oldPrice ? `<br><span style="font-size:.76rem;color:var(--a-ink-soft);text-decoration:line-through">${ubFormatPrice(p.oldPrice)}</span>` : ''}</td>
        <td>${p.stock} unités</td>
        <td>${ubStockBadge(p.stock)}</td>
        <td>
          <div class="a-actions-cell">
            <button class="a-icon-action" onclick="ubOpenModal('${p.id}')" title="Modifier">${ubIcon('edit')}</button>
            <button class="a-icon-action" onclick="ubDeleteProduct('${p.id}')" title="Supprimer">${ubIcon('trash')}</button>
          </div>
        </td>
      </tr>`).join('') : `<tr><td colspan="6"><div class="empty-state">${ubIcon('box')}<p>Aucun produit ne correspond à vos filtres.</p></div></td></tr>`;
  }

  function ubOpenModal(id) {
    const modal = document.getElementById('product-modal');
    const catSelect = document.getElementById('f-category');
    catSelect.innerHTML = UB_CATEGORIES.map(c => `<option value="${c.id}">${c.name}</option>`).join('');
    currentPhoto = null; currentVideo = null;
    document.getElementById('photo-preview').innerHTML = '';
    document.getElementById('video-preview').innerHTML = '';

    if (id) {
      const p = products.find(x => x.id === id);
      document.getElementById('modal-title').textContent = 'Modifier le produit';
      document.getElementById('f-id').value = p.id;
      document.getElementById('f-name').value = p.name;
      document.getElementById('f-category').value = p.category;
      document.getElementById('f-price').value = p.price;
      document.getElementById('f-oldprice').value = p.oldPrice || '';
      document.getElementById('f-stock').value = p.stock;
      document.getElementById('f-desc').value = p.desc;
      currentPhoto = p.img;
      document.getElementById('photo-preview').innerHTML = `<div class="item"><img src="${p.img}"></div>`;
    } else {
      document.getElementById('modal-title').textContent = 'Ajouter un produit';
      document.getElementById('product-form').reset();
      document.getElementById('f-id').value = '';
    }
    modal.classList.add('open');
  }
  function ubCloseModal() { document.getElementById('product-modal').classList.remove('open'); }

  document.getElementById('f-photo-input').addEventListener('change', (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      currentPhoto = reader.result;
      document.getElementById('photo-preview').innerHTML = `<div class="item"><img src="${currentPhoto}"><button type="button" onclick="event.stopPropagation(); currentPhoto=null; document.getElementById('photo-preview').innerHTML='';">✕</button></div>`;
    };
    reader.readAsDataURL(file);
  });
  document.getElementById('f-video-input').addEventListener('change', (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      currentVideo = reader.result;
      document.getElementById('video-preview').innerHTML = `<div class="item"><video src="${currentVideo}" muted></video><button type="button" onclick="event.stopPropagation(); currentVideo=null; document.getElementById('video-preview').innerHTML='';">✕</button></div>`;
    };
    reader.readAsDataURL(file);
  });

  function ubSaveProduct() {
    const form = document.getElementById('product-form');
    if (!form.checkValidity()) { form.reportValidity(); return; }
    const id = document.getElementById('f-id').value;
    const data = {
      name: document.getElementById('f-name').value,
      category: document.getElementById('f-category').value,
      price: Number(document.getElementById('f-price').value),
      oldPrice: document.getElementById('f-oldprice').value ? Number(document.getElementById('f-oldprice').value) : null,
      stock: Number(document.getElementById('f-stock').value),
      desc: document.getElementById('f-desc').value,
      img: currentPhoto || 'https://images.unsplash.com/photo-1522335789203-aabd1fc54bc9?q=80&w=800&auto=format&fit=crop',
      video: currentVideo || null,
      rating: 4.5, reviews: 0, tag: null,
    };

    if (id) {
      const idx = products.findIndex(p => p.id === id);
      products[idx] = { ...products[idx], ...data };
      ubAToast('Produit mis à jour avec succès');
    } else {
      data.id = 'p' + Date.now();
      products.push(data);
      ubAToast('Produit ajouté avec succès');
    }
    ubAdminSaveProducts(products);
    ubCloseModal();
    renderTable();
  }

  function ubDeleteProduct(id) {
    if (!confirm('Supprimer définitivement ce produit ?')) return;
    products = products.filter(p => p.id !== id);
    ubAdminSaveProducts(products);
    ubAToast('Produit supprimé');
    renderTable();
  }

  renderContent();
</script>
</body>
</html>
