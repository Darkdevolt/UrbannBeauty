<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Finances — Admin Urbann Beauty</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/admin.css">
<style>
.report-bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:18px}
.report-bar select{border:1px solid var(--a-line);border-radius:10px;padding:9px 12px;font:inherit;font-size:.84rem;background:#fff}
.report-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:18px}
.report-stat{padding:16px;border:1px solid var(--a-line);border-radius:14px}
.report-stat .value{font-family:'Playfair Display',serif;font-size:1.5rem}
.report-stat .label{font-size:.78rem;color:var(--a-ink-soft);margin-top:4px}
.report-stat .change{font-size:.74rem;font-weight:600;margin-top:6px}
.report-stat .change.up{color:var(--a-success)}
.report-stat .change.down{color:var(--a-danger)}
@media(max-width:700px){.report-stats{grid-template-columns:1fr}}
</style>
<link rel="icon" type="image/png" href="https://tbowuuxvjaadawhmpumr.supabase.co/storage/v1/object/public/media/logo.png"></head>
<body>

<div class="admin-shell" id="admin-shell"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="../assets/js/icons.js"></script>
<script src="../assets/js/data.js"></script>
<script src="../assets/js/media.js"></script>
<script src="assets/admin.js"></script>
<script>
async function main() {
  if (!(await ubAdminGuard())) return;
  await ubAdminRenderShell('finances', 'Finances', "Etat financier rapide : ventes, sommes a recevoir et a payer");

  const [orders, suppliers, products] = await Promise.all([ubAdminGetOrders(), ubAdminGetSuppliers(), ubAdminGetProducts()]);
  const productsById = ubProductsById(products);
  const activeOrders = orders.filter(o => o.status !== 'annulee');

  const revenue = activeOrders.reduce((s, o) => s + ubOrderTotal(o, productsById), 0);
  const encaisse = activeOrders.filter(o => o.paymentStatus === 'paye').reduce((s, o) => s + ubOrderTotal(o, productsById), 0);
  const receivables = ubComputeReceivables(orders, productsById);
  const payables = ubComputePayables(suppliers);
  const soldeNet = receivables.total - payables.total;
  const profitability = ubComputeProfitability(orders, productsById);
  const rotation = ubComputeProductRotation(products, orders);

  document.getElementById('a-content').innerHTML = `
    <div class="a-stats-grid">
      <div class="a-panel a-stat-card">
        <div class="icon" style="background:#f5eefb;color:#8e56bd">${ubIcon('chart')}</div>
        <div class="value">${ubFormatPrice(revenue)}</div><div class="label">Chiffre d'affaires total</div>
      </div>
      <div class="a-panel a-stat-card">
        <div class="icon" style="background:#e6f6ec;color:#2f9e63">${ubIcon('check')}</div>
        <div class="value">${ubFormatPrice(encaisse)}</div><div class="label">Encaissé (payé)</div>
      </div>
      <div class="a-panel a-stat-card">
        <div class="icon" style="background:#fbf1e3;color:#c98a3e">${ubIcon('clock')}</div>
        <div class="value">${ubFormatPrice(receivables.total)}</div><div class="label">À recevoir (créances clients)</div>
      </div>
      <div class="a-panel a-stat-card">
        <div class="icon" style="background:#fbe9ec;color:#d1495c">${ubIcon('truck')}</div>
        <div class="value">${ubFormatPrice(payables.total)}</div><div class="label">À payer (dettes fournisseurs)</div>
      </div>
    </div>

    <div class="a-panel" style="margin-bottom:22px">
      <div class="a-panel-body" style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:16px">
        <div>
          <div style="font-size:.82rem;color:var(--a-ink-soft);margin-bottom:4px">Solde net (créances − dettes)</div>
          <div style="font-family:'Playfair Display',serif;font-size:2rem;color:${soldeNet >= 0 ? 'var(--a-success)' : 'var(--a-danger)'}">${soldeNet >= 0 ? '+' : ''}${ubFormatPrice(soldeNet)}</div>
        </div>
        <p style="max-width:420px;color:var(--a-ink-soft);font-size:.86rem;margin:0">
          ${soldeNet >= 0
            ? "Vos clients vous doivent globalement plus que ce que vous devez à vos fournisseurs."
            : "Vous devez actuellement plus à vos fournisseurs que ce que vos clients vous doivent — priorisez le recouvrement ou négociez vos échéances."}
        </p>
        <button class="a-btn a-btn-outline" onclick="ubExportFinances()">${ubIcon('upload')} Exporter le rapport complet</button>
      </div>
    </div>

    <div class="a-grid-2">
      <div class="a-panel">
        <div class="a-panel-head">
          <h3>Créances clients (à recevoir)</h3>
          <a href="commandes.html" class="a-btn a-btn-outline a-btn-sm">Voir les commandes</a>
        </div>
        <div class="a-table-wrap">
          <table class="a-table">
            <thead><tr><th>Cliente</th><th>Commande(s)</th><th>Montant dû</th></tr></thead>
            <tbody id="receivables-tbody"></tbody>
          </table>
        </div>
      </div>
      <div class="a-panel">
        <div class="a-panel-head">
          <h3>Dettes fournisseurs (à payer)</h3>
          <a href="fournisseurs.html" class="a-btn a-btn-outline a-btn-sm">Gérer</a>
        </div>
        <div class="a-table-wrap">
          <table class="a-table">
            <thead><tr><th>Fournisseur</th><th>Échéance</th><th>Montant dû</th></tr></thead>
            <tbody id="payables-tbody"></tbody>
          </table>
        </div>
      </div>
    </div>

    <div class="a-panel" style="padding:22px;margin-top:22px">
      <div class="a-panel-head" style="padding:0 0 16px">
        <div><h3 style="margin:0">Rapports périodiques</h3><p style="margin:4px 0 0;color:var(--a-ink-soft);font-size:.82rem">Chiffre d'affaires, commandes et meilleurs produits sur une période, comparés à la période précédente.</p></div>
        <button class="a-btn a-btn-outline a-btn-sm" id="report-export">${ubIcon('upload')} Exporter (CSV)</button>
      </div>
      <div class="report-bar">
        <select id="report-type">
          <option value="month">Mensuel</option>
          <option value="quarter">Trimestriel</option>
          <option value="semester">Semestriel</option>
        </select>
        <select id="report-period"></select>
        <select id="report-year"></select>
      </div>
      <div class="report-stats" id="report-stats"></div>
      <div class="a-table-wrap">
        <table class="a-table">
          <thead><tr><th>Meilleurs produits de la période</th><th>Quantité vendue</th></tr></thead>
          <tbody id="report-bestsellers"></tbody>
        </table>
      </div>
    </div>

    <div class="a-panel" style="padding:22px;margin-top:22px">
      <div class="a-panel-head" style="padding:0 0 16px">
        <div><h3 style="margin:0">Rentabilité & rotation des stocks</h3><p style="margin:4px 0 0;color:var(--a-ink-soft);font-size:.82rem">Marge réelle par produit (prix de vente − prix d'achat) et vitesse d'écoulement du stock. Renseignez le prix d'achat dans Produits & Stock pour activer ces calculs.</p></div>
      </div>
      <div class="report-stats" style="margin-bottom:20px">
        <div class="report-stat"><div class="value">${ubFormatPrice(profitability.revenue)}</div><div class="label">Chiffre d'affaires (hors annulées)</div></div>
        <div class="report-stat"><div class="value">${ubFormatPrice(profitability.cogs)}</div><div class="label">Coût des produits vendus</div></div>
        <div class="report-stat"><div class="value" style="color:${profitability.margin>=0?'var(--a-success)':'var(--a-danger)'}">${ubFormatPrice(profitability.margin)} (${profitability.marginPct}%)</div><div class="label">Marge brute</div></div>
      </div>
      <div class="a-table-wrap">
        <table class="a-table">
          <thead><tr><th>Produit</th><th>Prix d'achat</th><th>Prix de vente</th><th>Marge unitaire</th><th>Vendus</th><th>Marge totale</th><th>Stock actuel</th><th>Rotation</th></tr></thead>
          <tbody id="rotation-tbody"></tbody>
        </table>
      </div>
    </div>
  `;

  document.getElementById('receivables-tbody').innerHTML = receivables.list.length ? receivables.list.map(c => `
    <tr>
      <td><strong>${c.client}</strong>${c.phone ? `<br><span style="font-size:.76rem;color:var(--a-ink-soft)">${c.phone}</span>` : ''}</td>
      <td>${c.orders.join(', ')}</td>
      <td><strong style="color:var(--a-warning)">${ubFormatPrice(c.total)}</strong></td>
    </tr>`).join('') : `<tr><td colspan="3" style="color:var(--a-ink-soft)">Aucune créance en cours — toutes les commandes sont payées.</td></tr>`;

  document.getElementById('payables-tbody').innerHTML = payables.list.length ? payables.list.map(s => `
    <tr>
      <td><strong>${s.name}</strong>${ubSupplierIsLate(s) ? ' <span class="a-badge danger">En retard</span>' : ''}</td>
      <td>${new Date(s.dueDate).toLocaleDateString('fr-FR', { day: '2-digit', month: 'short', year: 'numeric' })}</td>
      <td><strong style="color:var(--a-danger)">${ubFormatPrice(s.amount)}</strong></td>
    </tr>`).join('') : `<tr><td colspan="3" style="color:var(--a-ink-soft)">Aucune dette fournisseur en cours.</td></tr>`;

  document.getElementById('rotation-tbody').innerHTML = rotation.length ? rotation.map(r => `
    <tr>
      <td><strong>${r.product.name}</strong></td>
      <td>${r.product.costPrice != null ? ubFormatPrice(r.product.costPrice) : '<span style="color:var(--a-ink-soft)">—</span>'}</td>
      <td>${ubFormatPrice(r.product.price)}</td>
      <td>${r.unitMargin != null ? `<strong style="color:${r.unitMargin>=0?'var(--a-success)':'var(--a-danger)'}">${ubFormatPrice(r.unitMargin)}</strong><br><span style="font-size:.74rem;color:var(--a-ink-soft)">${r.marginPct}%</span>` : '<span style="color:var(--a-ink-soft)">—</span>'}</td>
      <td>${r.qtySold}</td>
      <td>${r.totalMargin != null ? ubFormatPrice(r.totalMargin) : '<span style="color:var(--a-ink-soft)">—</span>'}</td>
      <td>${r.product.stock}</td>
      <td>${r.rotation === Infinity ? '<span class="a-badge success">Rupture / forte demande</span>' : r.rotation}</td>
    </tr>`).join('') : `<tr><td colspan="8" style="color:var(--a-ink-soft)">Aucun produit.</td></tr>`;

  /* ---------- Rapports périodiques ---------- */
  const MONTHS = ['Janvier','Février','Mars','Avril','Mai','Juin','Juillet','Août','Septembre','Octobre','Novembre','Décembre'];
  const now = new Date();
  const reportState = { type: 'month', period: now.getMonth() + 1, year: now.getFullYear() };
  let lastReport = null;

  function populateReportControls() {
    const typeEl = document.getElementById('report-type'), periodEl = document.getElementById('report-period'), yearEl = document.getElementById('report-year');
    typeEl.value = reportState.type;
    const periodOptions = reportState.type === 'month'
      ? MONTHS.map((m, i) => ({ value: i + 1, label: m }))
      : reportState.type === 'quarter'
      ? [1, 2, 3, 4].map(q => ({ value: q, label: `T${q}` }))
      : [1, 2].map(s => ({ value: s, label: `Semestre ${s}` }));
    periodEl.innerHTML = periodOptions.map(o => `<option value="${o.value}" ${o.value === reportState.period ? 'selected' : ''}>${o.label}</option>`).join('');
    const years = new Set([now.getFullYear(), now.getFullYear() - 1]);
    orders.forEach(o => { if (o.date) years.add(new Date(o.date).getFullYear()); });
    yearEl.innerHTML = [...years].sort((a, b) => b - a).map(y => `<option value="${y}" ${y === reportState.year ? 'selected' : ''}>${y}</option>`).join('');
  }

  function rangeFor(type, year, period) {
    if (type === 'month') return ubMonthRange(year, period);
    if (type === 'quarter') return ubQuarterRange(year, period);
    return ubSemesterRange(year, period);
  }

  function renderReport() {
    const [start, end] = rangeFor(reportState.type, reportState.year, reportState.period);
    const [prevYear, prevPeriod] = ubPreviousRange(reportState.type, reportState.year, reportState.period);
    const [prevStart, prevEnd] = rangeFor(reportState.type, prevYear, prevPeriod);
    const current = ubComputePeriodStats(orders, productsById, start, end);
    const previous = ubComputePeriodStats(orders, productsById, prevStart, prevEnd);
    lastReport = { current, previous, start, end };

    const stat = (value, label, change) => `<div class="report-stat"><div class="value">${value}</div><div class="label">${label}</div><div class="change ${change >= 0 ? 'up' : 'down'}">${change >= 0 ? '+' : ''}${change}% vs période précédente</div></div>`;
    document.getElementById('report-stats').innerHTML =
      stat(ubFormatPrice(current.revenue), "Chiffre d'affaires", ubPercentChange(current.revenue, previous.revenue)) +
      stat(current.count, 'Commandes', ubPercentChange(current.count, previous.count)) +
      stat(ubFormatPrice(current.avg), 'Panier moyen', ubPercentChange(current.avg, previous.avg));

    document.getElementById('report-bestsellers').innerHTML = current.bestSellers.length
      ? current.bestSellers.map(x => `<tr><td>${x.product.name}</td><td>${x.qty}</td></tr>`).join('')
      : `<tr><td colspan="2" style="color:var(--a-ink-soft)">Aucune vente sur cette période.</td></tr>`;
  }

  populateReportControls();
  renderReport();
  document.getElementById('report-type').addEventListener('change', e => { reportState.type = e.target.value; reportState.period = 1; populateReportControls(); renderReport(); });
  document.getElementById('report-period').addEventListener('change', e => { reportState.period = Number(e.target.value); renderReport(); });
  document.getElementById('report-year').addEventListener('change', e => { reportState.year = Number(e.target.value); renderReport(); });
  document.getElementById('report-export').addEventListener('click', () => {
    if (!lastReport) return;
    const { current, start, end } = lastReport;
    const headers = ['Periode', 'Chiffre affaires (FCFA)', 'Commandes', 'Panier moyen (FCFA)', 'Meilleur produit', 'Quantite'];
    const rows = [[`${start} au ${end}`, current.revenue, current.count, current.avg, current.bestSellers[0]?.product.name || '', current.bestSellers[0]?.qty || '']];
    ubExportCSV(`urbann-beauty-rapport-${start}_${end}.csv`, headers, rows);
  });

  window.ubExportFinances = function () {
    const headers = ['Type', 'Tiers', 'Reference', 'Montant (FCFA)', 'Echeance / date'];
    const rows = [
      ...receivables.list.map(c => ['Creance client (a recevoir)', c.client, c.orders.join(' / '), c.total, '']),
      ...payables.list.map(s => ['Dette fournisseur (a payer)', s.name, s.category || '', s.amount, s.dueDate]),
    ];
    ubExportCSV('urbann-beauty-rapport-financier.csv', headers, rows);
  };
}
main();
</script>
</body>
</html>
