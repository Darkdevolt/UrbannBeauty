<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Connexion Admin — Urbann Beauty</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/admin.css">
<link rel="icon" type="image/png" href="https://tbowuuxvjaadawhmpumr.supabase.co/storage/v1/object/public/media/logo.png"></head>
<body>

<div class="login-page">
  <div class="login-visual">
    <div class="logo" id="admin-login-logo">Urbann<span>Beauty</span></div>
    <h2>Gérez votre boutique en toute simplicité</h2>
    <p>Produits, stock, ventes et clients : pilotez toute votre activité depuis un tableau de bord unique, pensé pour aller à l'essentiel.</p>
  </div>
  <div class="login-form-wrap">
    <div class="login-form">
      <h1>Espace administration</h1>
      <p class="sub">Connectez-vous pour accéder à votre tableau de bord.</p>
      <form id="login-form">
        <div class="a-field">
          <label>Adresse email</label>
          <input type="email" id="login-email" required autocomplete="username">
        </div>
        <div class="a-field">
          <label>Mot de passe</label>
          <input type="password" id="login-password" required autocomplete="current-password">
        </div>
        <div class="remember-row">
          <span></span>
          <a href="#" style="color:var(--a-mauve)">Mot de passe oublié ?</a>
        </div>
        <div id="login-error" style="display:none;color:var(--a-danger);font-size:.84rem;margin:-8px 0 16px"></div>
        <button class="a-btn a-btn-primary a-btn-block" type="submit" id="login-submit">Se connecter</button>
      </form>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="../assets/js/icons.js"></script>
<script src="../assets/js/data.js"></script>
<script src="../assets/js/media.js"></script>
<script src="assets/admin.js"></script>
<script>
  ubApplyLogo(document.getElementById('admin-login-logo'));

  (async () => {
    const session = await ubAdminGetSession();
    if (session) location.href = 'dashboard.html';
  })();

  document.getElementById('login-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = document.getElementById('login-submit');
    const errorBox = document.getElementById('login-error');
    errorBox.style.display = 'none';
    btn.disabled = true;
    btn.textContent = 'Connexion...';
    const email = document.getElementById('login-email').value.trim();
    const password = document.getElementById('login-password').value;
    const { session, error } = await ubAdminLogin(email, password);
    if (error || !session) {
      errorBox.textContent = 'Email ou mot de passe incorrect.';
      errorBox.style.display = 'block';
      btn.disabled = false;
      btn.textContent = 'Se connecter';
      return;
    }
    location.href = 'dashboard.html';
  });
</script>
</body>
</html>
