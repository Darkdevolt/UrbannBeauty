<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Commandes & Ventes — Admin Urbann Beauty</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/admin.css">
</head>
<body>

<div class="admin-shell" id="admin-shell"></div>

<script src="../assets/js/icons.js"></script>
<script src="../assets/js/data.js"></script>
<script src="assets/admin.js"></script>
<script>
  ubAdminGuard();
  ubAdminRenderShell('commandes', 'Commandes & Ventes', 'Suivez et gérez toutes les commandes de votre boutique');

  let orders = ubAdminGetOrders();
  let filterState = { q: '', status: 'all' };

  function renderContent() {
    const revenue = orders.filter(o => o.status !== 'annulee').reduce((s, o) => s + o.total, 0);
    const counts = {
      livree: orders.filter(o => o.status === 'livree').length,
      en_cours: orders.filter(o => o.status === 'en_cours').length,
      en_attente: orders.filter(o => o.status === 'en_attente').length,
      annulee: orders.filter(o => o.status === 'annulee').length,
    };

    document.getElementById('a-content').innerHTML = `
      <div class="a-stats-grid">
        <div class="a-panel a-stat-card">
          <div class="icon" style="background:#f5eefb;color:#8e56bd">${ubIcon('chart')}</div>
          <div class="value">${ubFormatPrice(revenue)}</div><div class="label">Ventes totales</div>
        </div>
        <div class="a-panel a-stat-card">
          <div class="icon" style="background:#e6f6ec;color:#2f9e63">${ubIcon('check')}</div>
          <div class="value">${counts.livree}</div><div class="label">Commandes livrées</div>
        </div>
        <div class="a-panel a-stat-card">
          <div class="icon" style="background:#fbf1e3;color:#c98a3e">${ubIcon('clock')}</div>
          <div class="value">${counts.en_cours + counts.en_attente}</div><div class="label">En cours / en attente</div>
        </div>
        <div class="a-panel a-stat-card">
          <div class="icon" style="background:#fbe9ec;color:#d1495c">${ubIcon('close')}</div>
          <div class="value">${counts.annulee}</div><div class="label">Commandes annulées</div>
        </div>
      </div>

      <div class="a-toolbar">
        <div class="a-search">${ubIcon('search')}<input type="text" id="search-input" placeholder="Rechercher une commande ou un client...">
        </div>
        <div class="a-filters">
          <select class="a-select" id="filter-status">
            <option value="all">Tous les statuts</option>
            <option value="en_attente">En attente</option>
            <option value="en_cours">En cours</option>
            <option value="livree">Livrée</option>
            <option value="annulee">Annulée</option>
          </select>
        </div>
      </div>
      <div class="a-panel">
        <div class="a-table-wrap">
          <table class="a-table">
            <thead><tr><th>Commande</th><th>Client</th><th>Date</th><th>Articles</th><th>Paiement</th><th>Total</th><th>Statut</th><th>Action</th></tr></thead>
            <tbody id="orders-tbody"></tbody>
          </table>
        </div>
      </div>
    `;

    document.getElementById('search-input').addEventListener('input', e => { filterState.q = e.target.value.toLowerCase(); renderTable(); });
    document.getElementById('filter-status').addEventListener('change', e => { filterState.status = e.target.value; renderTable(); });
    renderTable();
  }

  function renderTable() {
    let list = orders.filter(o =>
      (o.id.toLowerCase().includes(filterState.q) || o.client.toLowerCase().includes(filterState.q)) &&
      (filterState.status === 'all' || o.status === filterState.status)
    );
    document.getElementById('orders-tbody').innerHTML = list.length ? list.map(o => `
      <tr>
        <td><strong>${o.id}</strong></td>
        <td>${o.client}</td>
        <td>${new Date(o.date).toLocaleDateString('fr-FR', { day: '2-digit', month: 'short', year: 'numeric' })}</td>
        <td>${o.items} article${o.items > 1 ? 's' : ''}</td>
        <td>${o.payment}</td>
        <td><strong>${ubFormatPrice(o.total)}</strong></td>
        <td>
          <select class="a-select" style="padding:6px 10px;font-size:.78rem" onchange="ubUpdateStatus('${o.id}', this.value)">
            <option value="en_attente" ${o.status === 'en_attente' ? 'selected' : ''}>En attente</option>
            <option value="en_cours" ${o.status === 'en_cours' ? 'selected' : ''}>En cours</option>
            <option value="livree" ${o.status === 'livree' ? 'selected' : ''}>Livrée</option>
            <option value="annulee" ${o.status === 'annulee' ? 'selected' : ''}>Annulée</option>
          </select>
        </td>
        <td><button class="a-icon-action" title="Voir détail" onclick="alert('Détail de la commande ${o.id} (maquette de démonstration)')">${ubIcon('edit')}</button></td>
      </tr>`).join('') : `<tr><td colspan="8"><div class="empty-state">${ubIcon('orders')}<p>Aucune commande ne correspond à votre recherche.</p></div></td></tr>`;
  }

  function ubUpdateStatus(id, status) {
    const o = orders.find(x => x.id === id);
    if (o) { o.status = status; ubAdminSaveOrders(orders); ubAToast(`Statut de ${id} mis à jour`); renderContent(); }
  }

  renderContent();
</script>
</body>
</html>
