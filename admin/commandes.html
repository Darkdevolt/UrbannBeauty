<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Commandes & Ventes — Admin Urbann Beauty</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/admin.css">
<link rel="icon" type="image/png" href="https://tbowuuxvjaadawhmpumr.supabase.co/storage/v1/object/public/media/logo.png"></head>
<body>

<div class="admin-shell" id="admin-shell"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="../assets/js/icons.js"></script>
<script src="../assets/js/data.js"></script>
<script src="../assets/js/media.js"></script>
<script src="assets/admin.js"></script>
<script>
let orders = [];
let productsById = {};
let packaging = [];
let filterState = { q: '', status: 'all', payment: 'all' };

async function main() {
  if (!(await ubAdminGuard())) return;
  await ubAdminRenderShell('commandes', 'Commandes & Ventes', 'Suivez les commandes, les livraisons et les paiements de votre boutique');

  const products = await ubAdminGetProducts();
  productsById = ubProductsById(products);
  [orders, packaging] = await Promise.all([ubAdminGetOrders(), ubAdminGetPackagingItems()]);
  renderContent();

  function renderContent() {
    const revenue = orders.filter(o => o.status !== 'annulee').reduce((s, o) => s + ubOrderTotal(o, productsById), 0);
    const counts = {
      livree: orders.filter(o => o.status === 'livree').length,
      en_cours: orders.filter(o => o.status === 'en_cours').length,
      en_attente: orders.filter(o => o.status === 'en_attente').length,
      annulee: orders.filter(o => o.status === 'annulee').length,
    };

    document.getElementById('a-content').innerHTML = `
      <div class="a-stats-grid">
        <div class="a-panel a-stat-card">
          <div class="icon" style="background:#f5eefb;color:#8e56bd">${ubIcon('chart')}</div>
          <div class="value">${ubFormatPrice(revenue)}</div><div class="label">Ventes totales</div>
        </div>
        <div class="a-panel a-stat-card">
          <div class="icon" style="background:#e6f6ec;color:#2f9e63">${ubIcon('check')}</div>
          <div class="value">${counts.livree}</div><div class="label">Commandes livrées</div>
        </div>
        <div class="a-panel a-stat-card">
          <div class="icon" style="background:#fbf1e3;color:#c98a3e">${ubIcon('clock')}</div>
          <div class="value">${counts.en_cours + counts.en_attente}</div><div class="label">En cours / en attente</div>
        </div>
        <div class="a-panel a-stat-card">
          <div class="icon" style="background:#fbe9ec;color:#d1495c">${ubIcon('close')}</div>
          <div class="value">${counts.annulee}</div><div class="label">Commandes annulées</div>
        </div>
      </div>

      <div class="a-toolbar">
        <div class="a-search">${ubIcon('search')}<input type="text" id="search-input" placeholder="Rechercher une commande ou un client...">
        </div>
        <div class="a-filters">
          <select class="a-select" id="filter-status">
            <option value="all">Tous les statuts</option>
            <option value="en_attente">En attente</option>
            <option value="en_cours">En cours</option>
            <option value="livree">Livrée</option>
            <option value="annulee">Annulée</option>
          </select>
          <select class="a-select" id="filter-payment">
            <option value="all">Tous les paiements</option>
            <option value="paye">Payé</option>
            <option value="en_attente">En attente</option>
            <option value="rembourse">Remboursé</option>
          </select>
          <button class="a-btn a-btn-outline" onclick="ubExportOrders()">${ubIcon('upload')} Exporter (Excel/CSV)</button>
        </div>
      </div>
      <div class="a-panel">
        <div class="a-table-wrap">
          <table class="a-table">
            <thead><tr><th>Commande</th><th>Cliente</th><th>Articles</th><th>Paiement</th><th>Total</th><th>Statut</th><th>Sachet</th><th>Actions</th></tr></thead>
            <tbody id="orders-tbody"></tbody>
          </table>
        </div>
      </div>
    `;

    document.getElementById('search-input').addEventListener('input', e => { filterState.q = ubNormalize(e.target.value); renderTable(); });
    document.getElementById('filter-status').addEventListener('change', e => { filterState.status = e.target.value; renderTable(); });
    document.getElementById('filter-payment').addEventListener('change', e => { filterState.payment = e.target.value; renderTable(); });
    renderTable();
  }

  function renderTable() {
    let list = orders.filter(o =>
      (ubNormalize(o.id).includes(filterState.q) || ubNormalize(o.client).includes(filterState.q)) &&
      (filterState.status === 'all' || o.status === filterState.status) &&
      (filterState.payment === 'all' || o.paymentStatus === filterState.payment)
    );
    document.getElementById('orders-tbody').innerHTML = list.length ? list.map(o => `
      <tr>
        <td><strong>${o.id}</strong>${o.isPickup ? ` <span title="Retrait en magasin" style="display:inline-flex;width:14px;height:14px;vertical-align:-3px;color:var(--a-mauve)">${ubIcon('bag')}</span>` : ''}<div class="a-sub">${new Date(o.date).toLocaleDateString('fr-FR', { day: '2-digit', month: 'short', year: 'numeric' })}</div></td>
        <td><strong style="font-weight:600">${o.client}</strong><div class="a-sub">${o.phone || ''}</div></td>
        <td class="a-nowrap">${o.items.filter(l => l.shadeName).map(l => `<span class="a-shade-dot" title="Teinte : ${l.shadeName}" style="background:${l.shadeHex || '#c9a58c'}"></span>`).join('')}${ubOrderItemCount(o)} article${ubOrderItemCount(o) > 1 ? 's' : ''}${ubOrderHasClientInfo(o) ? ` <span title="Info fournie par la cliente" style="display:inline-flex;vertical-align:-3px;color:var(--a-mauve)">${ubIcon('camera')}</span>` : ''}</td>
        <td>
          <div class="a-sub" style="margin:0 0 4px">${o.payment}</div>
          <select class="a-select a-select-sm" onchange="ubUpdatePayment('${o.id}', this.value)">
            <option value="paye" ${o.paymentStatus === 'paye' ? 'selected' : ''}>Payé</option>
            <option value="en_attente" ${o.paymentStatus === 'en_attente' ? 'selected' : ''}>En attente</option>
            <option value="rembourse" ${o.paymentStatus === 'rembourse' ? 'selected' : ''}>Remboursé</option>
          </select>
        </td>
        <td class="a-nowrap"><strong>${ubFormatPrice(ubOrderGrandTotal(o) ?? ubOrderTotal(o, productsById))}</strong>${ubOrderGrandTotal(o) == null ? `<div class="a-sub">hors livraison</div>` : ''}</td>
        <td>
          <select class="a-select a-select-sm" onchange="ubUpdateStatus('${o.id}', this.value)">
            <option value="en_attente" ${o.status === 'en_attente' ? 'selected' : ''}>En attente</option>
            <option value="en_cours" ${o.status === 'en_cours' ? 'selected' : ''}>En préparation / expédiée</option>
            <option value="livree" ${o.status === 'livree' ? 'selected' : ''}>Livrée</option>
            <option value="annulee" ${o.status === 'annulee' ? 'selected' : ''}>Annulée</option>
          </select>
        </td>
        <td>
          <select class="a-select a-select-sm" onchange="ubSetPackaging('${o.id}', this.value)">
            <option value="">— Aucun —</option>
            ${packaging.map(p => `<option value="${p.id}" ${o.packagingItemId === p.id ? 'selected' : ''}>${p.name}${p.heightCm && p.widthCm ? ` (${p.heightCm}×${p.widthCm}cm)` : ''} — ${p.quantityRemaining <= 0 ? 'épuisé' : p.quantityRemaining + ' restants'}</option>`).join('')}
          </select>
        </td>
        <td>
          <div class="a-actions-cell">
            <button class="a-icon-action" style="color:#25D366" type="button" onclick="ubOrderWa('${o.id}')" title="Message WhatsApp (modèles prêts à envoyer)">${ubIcon('whatsapp')}</button>
            <a class="a-icon-action" href="recu.html?id=${o.id}" target="_blank" title="Voir / imprimer le reçu">${ubIcon('receipt')}</a>
            <a class="a-icon-action" href="bon-commande.html?id=${o.id}" target="_blank" title="Bon de commande (préparation)">${ubIcon('orders')}</a>
            <button class="a-icon-action" onclick="ubDeleteOrder('${o.id}')" title="Supprimer définitivement cette commande">${ubIcon('trash')}</button>
          </div>
        </td>
      </tr>`).join('') : `<tr><td colspan="8"><div class="empty-state">${ubIcon('orders')}<p>Aucune commande ne correspond à votre recherche.</p></div></td></tr>`;
  }

  window.ubOrderWa = function (id) {
    const o = orders.find(x => x.id === id);
    if (!o) return;
    const templates = ubOrderWaTemplates(o);
    /* Le modele le plus probable selon l'etape de la commande est propose en premier. */
    const preferred = { en_attente: 'Commande reçue', en_cours: o.isPickup ? 'Prête au retrait' : 'En livraison', livree: 'Livrée + avis', annulee: 'Annulation' }[o.status];
    if (o.status === 'en_attente' && o.paymentStatus === 'paye') templates.unshift(...templates.splice(templates.findIndex(t => t.label === 'Paiement validé'), 1));
    else if (preferred) templates.unshift(...templates.splice(templates.findIndex(t => t.label === preferred), 1));
    ubOpenWaComposer({ title: `Commande ${o.id} — ${ubDecodeHtml(o.client)}`, phone: ubDecodeHtml(o.phone), templates });
  };

  window.ubUpdateStatus = async function (id, status) {
    const o = orders.find(x => x.id === id);
    if (!o) return;
    const ok = await ubAdminUpdateOrderStatus(id, status);
    if (!ok) { ubAToast('Erreur lors de la mise à jour'); return; }
    o.status = status;
    ubAToast(`Statut de ${id} mis à jour`);
    renderContent();
    ubAdminRefreshAlerts();
    /* Enchainement automatique : le message WhatsApp correspondant au nouveau statut
       est pret a partir, il suffit de valider (ou d'annuler). */
    if (o.phone) ubOrderWa(id);
  };
  window.ubUpdatePayment = async function (id, paymentStatus) {
    const o = orders.find(x => x.id === id);
    if (!o) return;
    const ok = await ubAdminUpdateOrderPayment(id, paymentStatus);
    if (!ok) { ubAToast('Erreur lors de la mise à jour'); return; }
    o.paymentStatus = paymentStatus;
    ubAToast(`Paiement de ${id} mis à jour`);
    renderContent();
    if (paymentStatus === 'paye' && o.phone && o.status !== 'annulee') {
      const templates = ubOrderWaTemplates(o);
      templates.unshift(...templates.splice(templates.findIndex(t => t.label === 'Paiement validé'), 1));
      ubOpenWaComposer({ title: `Paiement validé — ${o.id}`, phone: ubDecodeHtml(o.phone), templates });
    }
  };

  window.ubSetPackaging = async function (orderId, packagingItemId) {
    const o = orders.find(x => x.id === orderId);
    if (!o) return;
    const previousId = o.packagingItemId;
    if (previousId === (packagingItemId || null)) return;

    if (previousId) await ubAdminAdjustPackagingStock(previousId, 1);
    if (packagingItemId) await ubAdminAdjustPackagingStock(packagingItemId, -1);

    const pkg = packaging.find(p => p.id === packagingItemId);
    const ok = await ubAdminSetOrderPackaging(orderId, packagingItemId || null, pkg ? pkg.unitCost : null);
    if (!ok) { ubAToast('Erreur lors de la mise à jour'); return; }

    o.packagingItemId = packagingItemId || null;
    o.packagingCost = pkg ? pkg.unitCost : null;
    packaging = await ubAdminGetPackagingItems();
    ubAToast(packagingItemId ? `Sachet "${pkg.name}" assigné à ${orderId}` : `Sachet retiré de ${orderId}`);
    renderTable();
  };

  window.ubDeleteOrder = async function (id) {
    if (!confirm(`Supprimer définitivement la commande ${id} ? Cette action est irréversible.`)) return;
    const ok = await ubAdminDeleteOrder(id);
    if (!ok) { ubAToast('Erreur lors de la suppression'); return; }
    orders = orders.filter(o => o.id !== id);
    ubAToast(`Commande ${id} supprimée`);
    renderContent();
  };

  window.ubExportOrders = function () {
    const headers = ['Commande', 'Client', 'Téléphone', 'Adresse', 'Date', 'Articles', 'Mode de paiement', 'Statut paiement', 'Statut livraison', 'Sachet utilisé', 'Total (FCFA)'];
    const rows = orders.map(o => [
      o.id, o.client, o.phone || '', o.address || '', o.date, ubOrderItemCount(o), o.payment, o.paymentStatus, o.status,
      packaging.find(p => p.id === o.packagingItemId)?.name || '', ubOrderTotal(o, productsById),
    ]);
    ubExportCSV('urbann-beauty-commandes.csv', headers, rows);
  };
}
main();
</script>
</body>
</html>
