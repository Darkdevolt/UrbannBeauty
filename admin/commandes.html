<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Commandes & Ventes — Admin Urbann Beauty</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/admin.css">
</head>
<body>

<div class="admin-shell" id="admin-shell"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="../assets/js/icons.js"></script>
<script src="../assets/js/data.js"></script>
<script src="../assets/js/media.js"></script>
<script src="assets/admin.js"></script>
<script>
let orders = [];
let productsById = {};
let filterState = { q: '', status: 'all', payment: 'all' };

async function main() {
  if (!(await ubAdminGuard())) return;
  await ubAdminRenderShell('commandes', 'Commandes & Ventes', 'Suivez les commandes, les livraisons et les paiements de votre boutique');

  const products = await ubAdminGetProducts();
  productsById = ubProductsById(products);
  orders = await ubAdminGetOrders();
  renderContent();

  function renderContent() {
    const revenue = orders.filter(o => o.status !== 'annulee').reduce((s, o) => s + ubOrderTotal(o, productsById), 0);
    const counts = {
      livree: orders.filter(o => o.status === 'livree').length,
      en_cours: orders.filter(o => o.status === 'en_cours').length,
      en_attente: orders.filter(o => o.status === 'en_attente').length,
      annulee: orders.filter(o => o.status === 'annulee').length,
    };

    document.getElementById('a-content').innerHTML = `
      <div class="a-stats-grid">
        <div class="a-panel a-stat-card">
          <div class="icon" style="background:#f5eefb;color:#8e56bd">${ubIcon('chart')}</div>
          <div class="value">${ubFormatPrice(revenue)}</div><div class="label">Ventes totales</div>
        </div>
        <div class="a-panel a-stat-card">
          <div class="icon" style="background:#e6f6ec;color:#2f9e63">${ubIcon('check')}</div>
          <div class="value">${counts.livree}</div><div class="label">Commandes livrées</div>
        </div>
        <div class="a-panel a-stat-card">
          <div class="icon" style="background:#fbf1e3;color:#c98a3e">${ubIcon('clock')}</div>
          <div class="value">${counts.en_cours + counts.en_attente}</div><div class="label">En cours / en attente</div>
        </div>
        <div class="a-panel a-stat-card">
          <div class="icon" style="background:#fbe9ec;color:#d1495c">${ubIcon('close')}</div>
          <div class="value">${counts.annulee}</div><div class="label">Commandes annulées</div>
        </div>
      </div>

      <div class="a-toolbar">
        <div class="a-search">${ubIcon('search')}<input type="text" id="search-input" placeholder="Rechercher une commande ou un client...">
        </div>
        <div class="a-filters">
          <select class="a-select" id="filter-status">
            <option value="all">Tous les statuts</option>
            <option value="en_attente">En attente</option>
            <option value="en_cours">En cours</option>
            <option value="livree">Livrée</option>
            <option value="annulee">Annulée</option>
          </select>
          <select class="a-select" id="filter-payment">
            <option value="all">Tous les paiements</option>
            <option value="paye">Payé</option>
            <option value="en_attente">En attente</option>
            <option value="rembourse">Remboursé</option>
          </select>
          <button class="a-btn a-btn-outline" onclick="ubExportOrders()">${ubIcon('upload')} Exporter (Excel/CSV)</button>
        </div>
      </div>
      <div class="a-panel">
        <div class="a-table-wrap">
          <table class="a-table">
            <thead><tr><th>Commande</th><th>Client</th><th>Date</th><th>Articles</th><th>Paiement</th><th>Statut paiement</th><th>Total</th><th>Livraison</th><th>Reçu</th><th>Actions</th></tr></thead>
            <tbody id="orders-tbody"></tbody>
          </table>
        </div>
      </div>
    `;

    document.getElementById('search-input').addEventListener('input', e => { filterState.q = ubNormalize(e.target.value); renderTable(); });
    document.getElementById('filter-status').addEventListener('change', e => { filterState.status = e.target.value; renderTable(); });
    document.getElementById('filter-payment').addEventListener('change', e => { filterState.payment = e.target.value; renderTable(); });
    renderTable();
  }

  function renderTable() {
    let list = orders.filter(o =>
      (ubNormalize(o.id).includes(filterState.q) || ubNormalize(o.client).includes(filterState.q)) &&
      (filterState.status === 'all' || o.status === filterState.status) &&
      (filterState.payment === 'all' || o.paymentStatus === filterState.payment)
    );
    document.getElementById('orders-tbody').innerHTML = list.length ? list.map(o => `
      <tr>
        <td><strong>${o.id}</strong></td>
        <td>${o.client}</td>
        <td>${new Date(o.date).toLocaleDateString('fr-FR', { day: '2-digit', month: 'short', year: 'numeric' })}</td>
        <td>${ubOrderItemCount(o)} article${ubOrderItemCount(o) > 1 ? 's' : ''}</td>
        <td>${o.payment}</td>
        <td>
          <select class="a-select" style="padding:6px 10px;font-size:.78rem" onchange="ubUpdatePayment('${o.id}', this.value)">
            <option value="paye" ${o.paymentStatus === 'paye' ? 'selected' : ''}>Payé</option>
            <option value="en_attente" ${o.paymentStatus === 'en_attente' ? 'selected' : ''}>En attente</option>
            <option value="rembourse" ${o.paymentStatus === 'rembourse' ? 'selected' : ''}>Remboursé</option>
          </select>
        </td>
        <td><strong>${ubFormatPrice(ubOrderTotal(o, productsById))}</strong></td>
        <td>
          <select class="a-select" style="padding:6px 10px;font-size:.78rem" onchange="ubUpdateStatus('${o.id}', this.value)">
            <option value="en_attente" ${o.status === 'en_attente' ? 'selected' : ''}>En attente</option>
            <option value="en_cours" ${o.status === 'en_cours' ? 'selected' : ''}>En préparation / expédiée</option>
            <option value="livree" ${o.status === 'livree' ? 'selected' : ''}>Livrée</option>
            <option value="annulee" ${o.status === 'annulee' ? 'selected' : ''}>Annulée</option>
          </select>
        </td>
        <td><a class="a-icon-action" style="display:inline-flex" href="recu.html?id=${o.id}" target="_blank" title="Voir / imprimer le reçu">${ubIcon('receipt')}</a></td>
        <td>
          <div class="a-actions-cell">
            <a class="a-icon-action" style="color:#25D366" href="${ubWhatsAppOrderUpdateLink(o, UB_ORDER_STATUS_MSG[o.status])}" target="_blank" rel="noopener" title="Envoyer une mise à jour sur WhatsApp">${ubIcon('whatsapp')}</a>
            <button class="a-icon-action" onclick="ubDeleteOrder('${o.id}')" title="Supprimer définitivement cette commande">${ubIcon('trash')}</button>
          </div>
        </td>
      </tr>`).join('') : `<tr><td colspan="10"><div class="empty-state">${ubIcon('orders')}<p>Aucune commande ne correspond à votre recherche.</p></div></td></tr>`;
  }

  window.ubUpdateStatus = async function (id, status) {
    const o = orders.find(x => x.id === id);
    if (!o) return;
    const ok = await ubAdminUpdateOrderStatus(id, status);
    if (!ok) { ubAToast('Erreur lors de la mise à jour'); return; }
    o.status = status;
    ubAToast(`Statut de ${id} mis à jour`);
    renderContent();
  };
  window.ubUpdatePayment = async function (id, paymentStatus) {
    const o = orders.find(x => x.id === id);
    if (!o) return;
    const ok = await ubAdminUpdateOrderPayment(id, paymentStatus);
    if (!ok) { ubAToast('Erreur lors de la mise à jour'); return; }
    o.paymentStatus = paymentStatus;
    ubAToast(`Paiement de ${id} mis à jour`);
    renderContent();
  };

  window.ubDeleteOrder = async function (id) {
    if (!confirm(`Supprimer définitivement la commande ${id} ? Cette action est irréversible.`)) return;
    const ok = await ubAdminDeleteOrder(id);
    if (!ok) { ubAToast('Erreur lors de la suppression'); return; }
    orders = orders.filter(o => o.id !== id);
    ubAToast(`Commande ${id} supprimée`);
    renderContent();
  };

  window.ubExportOrders = function () {
    const headers = ['Commande', 'Client', 'Téléphone', 'Adresse', 'Date', 'Articles', 'Mode de paiement', 'Statut paiement', 'Statut livraison', 'Total (FCFA)'];
    const rows = orders.map(o => [
      o.id, o.client, o.phone || '', o.address || '', o.date, ubOrderItemCount(o), o.payment, o.paymentStatus, o.status, ubOrderTotal(o, productsById),
    ]);
    ubExportCSV('urbann-beauty-commandes.csv', headers, rows);
  };
}
main();
</script>
</body>
</html>
