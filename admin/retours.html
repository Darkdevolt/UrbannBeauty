<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Retours — Admin Urbann Beauty</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/admin.css">
<style>
.op-toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.op-toolbar input,.op-toolbar select,.op-form input,.op-form select,.op-form textarea{border:1px solid var(--a-line);border-radius:10px;padding:10px 12px;background:#fff;color:var(--a-ink);font:inherit}.op-toolbar input{min-width:270px}.op-phone{font-weight:600;white-space:nowrap}.op-meta{font-size:.76rem;color:var(--a-ink-soft);margin-top:3px}.op-form{display:grid;grid-template-columns:1fr 1fr;gap:12px}.op-form .full{grid-column:1/-1}.op-form label{font-size:.75rem;font-weight:600;color:var(--a-ink-soft);display:flex;flex-direction:column;gap:6px}.op-empty{padding:30px;text-align:center;color:var(--a-ink-soft)}
@media(max-width:800px){.op-form{grid-template-columns:1fr}.op-form .full{grid-column:auto}}
</style>
</head>
<body><div class="admin-shell" id="admin-shell"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="../assets/js/icons.js"></script><script src="../assets/js/data.js"></script><script src="../assets/js/media.js"></script><script src="assets/admin.js"></script>
<script>
const RETURN_STATUSES={demande:'Demandé',valide:'Validé',recuperation:'En attente de récupération',recu:'Reçu',rembourse:'Remboursé',echange:'Échangé',refuse:'Refusé'};
const esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
function addOpsNav(){const nav=document.querySelector('.a-nav');if(!nav)return;nav.insertAdjacentHTML('beforeend',`<div class="group-label">Logistique</div><a href="livraison.html">${ubIcon('truck')} Livraisons</a><a href="zones.html">${ubIcon('filter')} Zones de livraison</a><a href="retours.html" class="active">${ubIcon('truck')} Retours</a>`)}
async function loadReturns(){const {data,error}=await ubSupabase.from('returns').select('*').order('requested_at',{ascending:false});if(error){console.error(error);alert(error.message);return []}return data||[]}
async function loadOrders(){const {data}=await ubSupabase.from('orders').select('id,client_name,phone');return data||[]}
async function loadProducts(){return await ubGetAllProducts()}
async function main(){if(!(await ubAdminGuard()))return;await ubAdminRenderShell('retours','Retours','Centralisez les demandes de retour, échanges et remboursements');addOpsNav();
let [returns,orders,products]=await Promise.all([loadReturns(),loadOrders(),loadProducts()]);const orderMap=Object.fromEntries(orders.map(o=>[o.id,o]));const productMap=Object.fromEntries(products.map(p=>[p.id,p]));
const render=()=>{const q=(document.getElementById('search').value||'').trim().toLowerCase();const st=document.getElementById('status').value;const list=returns.filter(r=>(!q||[r.order_id,r.phone,r.client_name,productMap[r.product_id]?.name].join(' ').toLowerCase().includes(q))&&(!st||r.status===st));document.getElementById('count').textContent=`${list.length} retour${list.length>1?'s':''}`;document.getElementById('tbody').innerHTML=list.map(r=>`<tr><td><strong>${esc(r.order_id)}</strong><div class="op-meta">${new Date(r.requested_at).toLocaleDateString('fr-FR')}</div></td><td><strong>${esc(r.client_name||orderMap[r.order_id]?.client_name||'—')}</strong><div class="op-phone">${esc(r.phone||orderMap[r.order_id]?.phone||'—')}</div></td><td>${esc(productMap[r.product_id]?.name||'Produit supprimé')} × ${r.qty}</td><td>${esc(r.reason||'—')}</td><td><select class="return-status" data-id="${esc(r.id)}">${Object.entries(RETURN_STATUSES).map(([k,v])=>`<option value="${k}" ${r.status===k?'selected':''}>${v}</option>`).join('')}</select></td><td><strong>${ubFormatPrice(r.refund_amount||0)}</strong><div class="op-meta">${esc(r.notes||'')}</div></td><td><button class="a-btn a-btn-outline a-btn-sm" onclick="editReturn('${esc(r.id)}')">Modifier</button></td></tr>`).join('')||`<tr><td colspan="7" class="op-empty">Aucun retour trouvé.</td></tr>`;document.querySelectorAll('.return-status').forEach(s=>s.onchange=async()=>{const {error}=await ubSupabase.from('returns').update({status:s.value,updated_at:new Date().toISOString()}).eq('id',s.dataset.id);if(error){alert(error.message);return}returns.find(r=>r.id===s.dataset.id).status=s.value;ubAToast('Statut du retour mis à jour');render()})};
window.editReturn=id=>{const r=returns.find(x=>x.id===id);if(!r)return;document.getElementById('edit').dataset.id=id;document.getElementById('phone').value=r.phone||'';document.getElementById('client').value=r.client_name||'';document.getElementById('order').value=r.order_id||'';document.getElementById('product').value=r.product_id||'';document.getElementById('qty').value=r.qty||1;document.getElementById('reason').value=r.reason||'';document.getElementById('status-edit').value=r.status||'demande';document.getElementById('refund').value=r.refund_amount||0;document.getElementById('notes').value=r.notes||'';document.getElementById('edit').style.display='block'};
document.getElementById('a-content').innerHTML=`<div class="a-panel" style="margin-bottom:18px"><div class="a-panel-body"><div class="op-toolbar"><input id="search" placeholder="Rechercher par téléphone, client ou commande"><select id="status"><option value="">Tous les statuts</option>${Object.entries(RETURN_STATUSES).map(([k,v])=>`<option value="${k}">${v}</option>`).join('')}</select><button class="a-btn a-btn-primary" onclick="newReturn()">Nouveau retour</button><span id="count" class="a-badge neutral"></span></div></div></div><div class="a-panel" id="edit" style="display:none;margin-bottom:18px"><div class="a-panel-head"><h3>Gestion du retour</h3><button class="a-btn a-btn-outline a-btn-sm" onclick="document.getElementById('edit').style.display='none'">Fermer</button></div><div class="a-panel-body"><div class="op-form"><label>Numéro de téléphone<input id="phone" placeholder="+221 77 000 00 00"></label><label>Client<input id="client" placeholder="Nom du client"></label><label>Commande<input id="order" placeholder="UB-..." required></label><label>Produit<select id="product"><option value="">Sélectionner</option>${products.map(p=>`<option value="${esc(p.id)}">${esc(p.name)}</option>`).join('')}</select></label><label>Quantité<input id="qty" type="number" min="1" value="1"></label><label>Motif<input id="reason" placeholder="Produit défectueux, taille, erreur..."></label><label>Statut<select id="status-edit">${Object.entries(RETURN_STATUSES).map(([k,v])=>`<option value="${k}">${v}</option>`).join('')}</select></label><label>Montant à rembourser<input id="refund" type="number" min="0" step="1" value="0"></label><label class="full">Notes<textarea id="notes" rows="3" placeholder="Détails du retour, échange, remboursement..."></textarea></label><div class="full"><button class="a-btn a-btn-primary" id="save">Enregistrer le retour</button></div></div></div></div><div class="a-panel"><div class="a-panel-head"><div><h3>Historique des retours</h3><div class="op-meta">La recherche par téléphone permet de retrouver toutes les demandes d'une cliente.</div></div></div><div class="a-table-wrap"><table class="a-table"><thead><tr><th>Commande</th><th>Client / Téléphone</th><th>Produit</th><th>Motif</th><th>Statut</th><th>Remboursement</th><th></th></tr></thead><tbody id="tbody"></tbody></table></div></div>`;
window.newReturn=()=>{document.getElementById('edit').dataset.id='';['phone','client','order','reason','notes'].forEach(id=>document.getElementById(id).value='');document.getElementById('product').value='';document.getElementById('qty').value=1;document.getElementById('status-edit').value='demande';document.getElementById('refund').value=0;document.getElementById('edit').style.display='block'};
document.getElementById('search').oninput=render;document.getElementById('status').onchange=render;document.getElementById('save').onclick=async()=>{const id=document.getElementById('edit').dataset.id;const payload={order_id:document.getElementById('order').value.trim(),phone:document.getElementById('phone').value.trim(),client_name:document.getElementById('client').value.trim()||null,product_id:document.getElementById('product').value||null,qty:Number(document.getElementById('qty').value||1),reason:document.getElementById('reason').value.trim()||null,status:document.getElementById('status-edit').value,refund_amount:Number(document.getElementById('refund').value||0),notes:document.getElementById('notes').value.trim()||null,updated_at:new Date().toISOString()};if(!payload.order_id||!payload.phone){alert('Le numéro de téléphone et la commande sont obligatoires.');return}let result;if(id)result=await ubSupabase.from('returns').update(payload).eq('id',id);else result=await ubSupabase.from('returns').insert(payload);if(result.error){alert(result.error.message);return}returns=await loadReturns();document.getElementById('edit').style.display='none';ubAToast(id?'Retour modifié':'Retour enregistré');render()};render()}
main();
</script></body></html>
